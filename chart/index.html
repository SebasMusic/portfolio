<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Chart Studio</title>
  
  <!-- Tipografía Bungee exacta para el título e Inter para el cuerpo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- html2canvas para exportar a PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-dark: #090c15;
      --panel-bg: rgba(18, 22, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-purple: #a855f7;
      --accent-cyan: #06b6d4;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --paper-bg: #ffffff;
      --paper-text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BARRA SUPERIOR */
    .top-nav {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 15px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-back:hover {
      color: #fff;
      border-color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.2);
      transform: translateX(-3px);
    }

    /* LAYOUT STUDIO */
    .studio-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* PANEL LATERAL DE CONTROL */
    .toolbox-panel {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .toolbox-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolbox-title {
      font-size: 0.8em;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-light);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tool-btn:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: var(--accent-purple);
      color: #fff;
    }

    .tool-btn.primary {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      color: #fff;
      font-weight: 700;
    }

    .tool-btn.primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .tool-btn.custom-btn {
      border: 1px dashed var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .select-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85em;
      outline: none;
    }

    /* CONTENEDOR MULTI-HOJA A4 */
    .sheets-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      background: #e2e8f0;
      padding: 30px;
      border-radius: 20px;
      align-items: center;
    }

    .chart-paper {
      width: 794px;
      height: 1123px; /* Tamaño A4 estricto */
      background: var(--paper-bg);
      color: var(--paper-text);
      padding: 45px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border-radius: 14px;
      border: 2px solid #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .chart-paper::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px dashed rgba(15, 23, 42, 0.25);
      border-radius: 8px;
      pointer-events: none;
    }

    .paper-inner {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    .chart-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
    }

    .song-title-editable {
      font-family: 'Bungee', cursive, sans-serif;
      font-size: 2em;
      text-transform: uppercase;
      text-align: center;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      background: transparent;
      letter-spacing: 1px;
    }

    .song-title-editable::placeholder { color: #cbd5e1; }

    .header-sub-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88em;
      font-weight: 600;
      color: #475569;
    }

    .editable-sub {
      border: none;
      outline: none;
      background: transparent;
      color: #334155;
      font-weight: 600;
      font-size: 1em;
    }

    .editable-sub::placeholder { color: #cbd5e1; }

    .chart-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* BADGE DE SECCIÓN EDITABLE EN LINEA */
    .section-badge {
      display: inline-block;
      align-self: flex-start;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
      font-size: 0.85em;
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
      border: none;
      outline: none;
      text-transform: uppercase;
    }

    .measures-grid {
      display: flex;
      flex-wrap: wrap;
      border-left: 2px solid #0f172a;
    }

    .measure-box {
      height: 72px;
      border-right: 2px solid #0f172a;
      border-top: 2px solid #0f172a;
      border-bottom: 2px solid #0f172a;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: #fff;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .measure-box.selected {
      background: #f0fdf4;
      border-color: #16a34a !important;
    }

    .measure-box.break-system {
      flex-basis: 100% !important;
      height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
    }

    .chord-input {
      font-size: 1.15em;
      font-weight: 800;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      background: transparent;
    }

    .rhythm-slashes {
      display: flex;
      justify-content: space-around;
      color: #94a3b8;
      font-size: 1.1em;
      user-select: none;
      font-weight: 700;
    }

    /* ANOTACIÓN DE BANDA EDITABLE EN LINEA */
    .band-annotation {
      position: absolute;
      top: -10px;
      right: 6px;
      font-size: 0.7em;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #bfdbfe;
      outline: none;
    }

    .chart-footer {
      border-top: 1.5px dashed #cbd5e1;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8em;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .footer-title-ref {
      text-transform: uppercase;
      color: #334155;
    }

    @media (max-width: 950px) {
      .studio-layout { grid-template-columns: 1fr; }
      .sheets-container { padding: 10px; }
      .chart-paper { width: 100%; height: auto; min-height: 1123px; }
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN SUPERIOR -->
  <div class="top-nav">
    <a href="../index.html" class="btn-back">← INICIO</a>
  </div>

  <div class="studio-layout">
    
    <!-- PANEL LATERAL DE CONTROL -->
    <div class="toolbox-panel">
      
      <!-- EXPORTAR & TRANSPOSICIÓN -->
      <div class="toolbox-section">
        <div class="toolbox-title">⚡ Acciones Principales</div>
        <button class="tool-btn primary" onclick="exportAllPagesToPNG()">📥 Descargar Todo (PNG)</button>
        
        <div style="display:flex; gap:8px; margin-top:5px;">
          <button class="tool-btn" style="flex:1;" onclick="transposeAll(-1)">♭ -1 Semitono</button>
          <button class="tool-btn" style="flex:1;" onclick="transposeAll(1)">♯ +1 Semitono</button>
        </div>
      </div>

      <!-- MÉTRICA DE TIEMPO -->
      <div class="toolbox-section">
        <div class="toolbox-title">⏱️ Métrica de Tiempo</div>
        <select class="select-input" id="timeSignatureSelect" onchange="updateTimeSignature(this.value)">
          <option value="4/4" selected>4/4 (Cuatro por Cuatro)</option>
          <option value="3/4">3/4 (Tres por Cuatro)</option>
          <option value="2/4">2/4 (Dos por Cuatro)</option>
          <option value="6/8">6/8 (Seis por Ocho)</option>
          <option value="9/8">9/8 (Nueve por Ocho)</option>
          <option value="12/8">12/8 (Doce por Ocho)</option>
          <option value="2/2">2/2 (Dos por Dos)</option>
        </select>
      </div>

      <!-- SECCIONES -->
      <div class="toolbox-section">
        <div class="toolbox-title">🏷️ Secciones</div>
        <div class="btn-grid">
          <button class="tool-btn custom-btn" onclick="addEditableSection()">✏️ EDITABLE</button>
          <button class="tool-btn" onclick="addSection('INTRO')">+ INTRO</button>
          <button class="tool-btn" onclick="addSection('VERSO')">+ VERSO</button>
          <button class="tool-btn" onclick="addSection('CORO')">+ CORO</button>
          <button class="tool-btn" onclick="addSection('PUENTE')">+ PUENTE</button>
          <button class="tool-btn" onclick="addSection('SOLO')">+ SOLO</button>
        </div>
      </div>

      <!-- INSERCIÓN Y AGRUPACIÓN DE COMPASES -->
      <div class="toolbox-section">
        <div class="toolbox-title">🎼 Inserción de Compases</div>
        <div style="font-size:0.75em; color:var(--text-muted); margin-bottom:4px;">Haz clic en un compás para seleccionarlo:</div>
        <button class="tool-btn" onclick="insertMeasure('before')">⬅️ Agregar ANTES del seleccionado</button>
        <button class="tool-btn" onclick="insertMeasure('after')">➡️ Agregar DESPUÉS del seleccionado</button>
        <button class="tool-btn" style="margin-top:6px; background:rgba(234,179,8,0.15); border-color:rgba(234,179,8,0.4); color:#fef08a;" onclick="toggleSystemBreak()">↵ Salto de Línea (Agrupar)</button>
        <button class="tool-btn" style="margin-top:4px; color:#fca5a5; border-color:rgba(239,68,68,0.3);" onclick="removeSelectedMeasure()">🗑️ Eliminar Compás Seleccionado</button>
      </div>

      <!-- INDICACIONES BANDA -->
      <div class="toolbox-section">
        <div class="toolbox-title">📌 Indicaciones Banda</div>
        <button class="tool-btn custom-btn" onclick="addAnnotation('✏️ Tu Nota', true)">✏️ Nota Personalizada</button>
        <div class="btn-grid" style="margin-top:6px;">
          <button class="tool-btn" onclick="addAnnotation('Banda IN')">Banda IN</button>
          <button class="tool-btn" onclick="addAnnotation('Tutti')">Tutti</button>
          <button class="tool-btn" onclick="addAnnotation('Corte')">Corte</button>
          <button class="tool-btn" onclick="addAnnotation('Pad Only')">Pad Only</button>
        </div>
      </div>

    </div>

    <!-- CONTENEDOR MULTI-PÁGINA A4 -->
    <div class="sheets-container" id="sheetsContainer">
      
      <!-- PÁGINA 1 -->
      <div class="chart-paper" id="paper-page-1">
        <div class="paper-inner">
          <div class="chart-header">
            <input type="text" class="song-title-editable" id="songTitleInput" placeholder="TÍTULO DE LA CANCIÓN" oninput="updateFooterTitle(this.value)">
            <div class="header-sub-row">
              <div><input type="text" class="editable-sub" placeholder="Artista / Banda" style="width:200px;"></div>
              <div>Métrica: <span class="displayTimeSig">4/4</span></div>
              <div><input type="text" class="editable-sub" placeholder="BPM: 120" style="width:90px; text-align:right;"></div>
            </div>
          </div>

          <div class="chart-content">
            <div class="section-block">
              <span class="section-badge" contenteditable="true">INTRO</span>
              <div class="measures-grid">
                <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
                  <input type="text" class="chord-input" placeholder="C">
                  <div class="rhythm-slashes">///////</div>
                </div>
                <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
                  <input type="text" class="chord-input" placeholder="G/B">
                  <div class="rhythm-slashes">///////</div>
                </div>
                <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
                  <input type="text" class="chord-input" placeholder="Am7">
                  <div class="rhythm-slashes">///////</div>
                </div>
                <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
                  <input type="text" class="chord-input" placeholder="F2">
                  <div class="rhythm-slashes">///////</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="chart-footer">
          <div class="footer-title-ref">UNTITLED CHART</div>
          <div class="page-num-ref">PÁG. 1 / 1</div>
        </div>
      </div>

    </div>

  </div>

  <script>
    let selectedMeasure = null;
    let pageCount = 1;

    function selectMeasure(el) {
      if (selectedMeasure) selectedMeasure.classList.remove('selected');
      selectedMeasure = el;
      selectedMeasure.classList.add('selected');
    }

    function updateTimeSignature(val) {
      document.querySelectorAll('.displayTimeSig').forEach(el => el.innerText = val);
    }

    function updateFooterTitle(val) {
      const text = val.trim() !== '' ? val.toUpperCase() : 'UNTITLED CHART';
      document.querySelectorAll('.footer-title-ref').forEach(el => el.innerText = text);
    }

    function getCurrentPageContent() {
      const pages = document.querySelectorAll('.chart-paper');
      const lastPage = pages[pages.length - 1];
      return lastPage.querySelector('.chart-content');
    }

    function checkPaginationOverflow() {
      const pages = document.querySelectorAll('.chart-paper');
      const lastPage = pages[pages.length - 1];
      const inner = lastPage.querySelector('.paper-inner');

      if (inner.scrollHeight > 920) {
        createNewPage();
      }
    }

    function createNewPage() {
      pageCount++;
      const container = document.getElementById('sheetsContainer');
      const titleText = document.getElementById('songTitleInput').value.toUpperCase() || 'UNTITLED CHART';
      const timeSig = document.getElementById('timeSignatureSelect').value;

      const newPaper = document.createElement('div');
      newPaper.className = 'chart-paper';
      newPaper.id = `paper-page-${pageCount}`;

      newPaper.innerHTML = `
        <div class="paper-inner">
          <div class="chart-header">
            <div style="font-family:'Bungee', cursive; font-size:1.4em; text-align:center; text-transform:uppercase;">${titleText} (CONT.)</div>
            <div class="header-sub-row">
              <div>Métrica: <span class="displayTimeSig">${timeSig}</span></div>
              <div>Continuación Hoja ${pageCount}</div>
            </div>
          </div>
          <div class="chart-content"></div>
        </div>
        <div class="chart-footer">
          <div class="footer-title-ref">${titleText}</div>
          <div class="page-num-ref">PÁG. ${pageCount} / ${pageCount}</div>
        </div>
      `;

      container.appendChild(newPaper);
      updateTotalPagesCounter();
    }

    function updateTotalPagesCounter() {
      const total = document.querySelectorAll('.chart-paper').length;
      document.querySelectorAll('.page-num-ref').forEach((el, idx) => {
        el.innerText = `PÁG. ${idx + 1} / ${total}`;
      });
    }

    function addEditableSection() {
      addSection('NUEVA SECCIÓN', true);
    }

    function addSection(title, isEditable = false) {
      const content = getCurrentPageContent();
      const newBlock = document.createElement('div');
      newBlock.className = 'section-block';

      newBlock.innerHTML = `
        <span class="section-badge" contenteditable="true">${title}</span>
        <div class="measures-grid">
          <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
            <input type="text" class="chord-input" placeholder="Acorde">
            <div class="rhythm-slashes">///////</div>
          </div>
          <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
            <input type="text" class="chord-input" placeholder="Acorde">
            <div class="rhythm-slashes">///////</div>
          </div>
          <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
            <input type="text" class="chord-input" placeholder="Acorde">
            <div class="rhythm-slashes">///////</div>
          </div>
          <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
            <input type="text" class="chord-input" placeholder="Acorde">
            <div class="rhythm-slashes">///////</div>
          </div>
        </div>
      `;
      content.appendChild(newBlock);
      checkPaginationOverflow();
    }

    function insertMeasure(position) {
      if (!selectedMeasure) {
        alert('Por favor haz clic primero en un compás para elegir la posición de inserción.');
        return;
      }

      const newBox = document.createElement('div');
      newBox.className = 'measure-box';
      newBox.style.flex = '0 0 25%';
      newBox.onclick = function() { selectMeasure(this); };
      newBox.innerHTML = `
        <input type="text" class="chord-input" placeholder="Acorde">
        <div class="rhythm-slashes">///////</div>
      `;

      if (position === 'before') {
        selectedMeasure.parentNode.insertBefore(newBox, selectedMeasure);
      } else {
        selectedMeasure.parentNode.insertBefore(newBox, selectedMeasure.nextSibling);
      }

      selectMeasure(newBox);
      checkPaginationOverflow();
    }

    function toggleSystemBreak() {
      if (!selectedMeasure) {
        alert('Selecciona un compás para agrupar o hacer un salto de línea.');
        return;
      }
      const grid = selectedMeasure.parentNode;
      const breakEl = document.createElement('div');
      breakEl.className = 'measure-box break-system';
      grid.insertBefore(breakEl, selectedMeasure.nextSibling);
      checkPaginationOverflow();
    }

    function removeSelectedMeasure() {
      if (selectedMeasure && selectedMeasure.parentNode) {
        selectedMeasure.parentNode.removeChild(selectedMeasure);
        selectedMeasure = null;
      }
    }

    function addAnnotation(text, isEditable = false) {
      if (!selectedMeasure) {
        alert('Haz clic en el compás donde quieres poner la indicación.');
        return;
      }
      let badge = selectedMeasure.querySelector('.band-annotation');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'band-annotation';
        badge.contentEditable = 'true';
        selectedMeasure.appendChild(badge);
      }
      badge.innerText = text;
    }

    const notesChromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const notesFlats = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

    function transposeChord(chord, semitones) {
      return chord.replace(/[A-G][#b]?/g, (match) => {
        let index = notesChromatic.indexOf(match);
        if (index === -1) index = notesFlats.indexOf(match);
        if (index === -1) return match;
        let newIndex = (index + semitones + 12) % 12;
        return notesChromatic[newIndex];
      });
    }

    function transposeAll(semitones) {
      document.querySelectorAll('.chord-input').forEach(input => {
        if (input.value.trim() !== '') {
          input.value = transposeChord(input.value, semitones);
        }
      });
    }

    function exportAllPagesToPNG() {
      const papers = document.querySelectorAll('.chart-paper');
      papers.forEach((paper, idx) => {
        html2canvas(paper, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          link.download = `chart-pagina-${idx + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      });
    }
  </script>
</body>
</html>
