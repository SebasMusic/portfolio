<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Chart Studio - Advanced Subdivisions</title>
  
  <!-- Google Analytics GA4 Base -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q3DTLYSJMH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Q3DTLYSJMH');
  </script>

  <!-- Tipografía Montserrat para el título e Inter para el cuerpo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  
  <!-- html2canvas y jsPDF para Exportación -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-dark: #090c15;
      --panel-bg: rgba(18, 22, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-purple: #a855f7;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --paper-bg: #ffffff;
      --paper-text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BARRA SUPERIOR CON SELECTOR DE IDIOMA */
    .top-nav {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-back:hover {
      color: #fff;
      border-color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.2);
      transform: translateX(-3px);
    }

    .lang-selector-mini {
      background: rgba(18, 22, 38, 0.85);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8em;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* LAYOUT STUDIO */
    .studio-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    .right-main-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    /* BARRA FLOTANTE DE TECLADO RÍTMICO CON SÍMBOLOS MUSICALES */
    .rhythm-toolbar {
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-cyan);
      border-radius: 16px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(6, 182, 212, 0.15);
      backdrop-filter: blur(15px);
    }

    .rhythm-title {
      font-size: 0.82em;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rhythm-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .rhythm-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-light);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rhythm-btn:hover, .rhythm-btn.active {
      background: rgba(6, 182, 212, 0.25);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .rhythm-btn.rest-btn {
      border-color: rgba(234, 179, 8, 0.4);
      color: #fef08a;
    }

    .rhythm-btn.rest-btn:hover {
      background: rgba(234, 179, 8, 0.25);
    }

    .key-badge {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #38bdf8;
      font-size: 0.68em;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 800;
      font-family: 'Inter', sans-serif;
    }

    .music-symbol {
      font-size: 1.2em;
      line-height: 1;
    }

    /* PANEL LATERAL DE CONTROL */
    .toolbox-panel {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 20px;
    }

    .toolbox-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolbox-title {
      font-size: 0.8em;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-light);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tool-btn:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: var(--accent-purple);
      color: #fff;
    }

    .tool-btn.primary {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      color: #fff;
      font-weight: 700;
    }

    .tool-btn.primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .tool-btn.custom-btn {
      border: 1px dashed var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* MENÚ FLOTANTE DE DESCARGA */
    .download-dropdown {
      position: relative;
      width: 100%;
    }

    .download-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px;
      margin-top: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      flex-direction: column;
      gap: 4px;
    }

    .download-dropdown.active .download-menu {
      display: flex;
    }

    .download-option {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8em;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s;
    }

    .download-option:hover {
      background: rgba(168, 85, 247, 0.3);
      border-color: var(--accent-purple);
    }

    .select-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85em;
      outline: none;
    }

    /* CONTENEDOR MULTI-HOJA A4 */
    .sheets-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      background: #e2e8f0;
      padding: 30px;
      border-radius: 20px;
      align-items: center;
      width: 100%;
    }

    .chart-paper {
      width: 794px;
      height: 1123px;
      max-height: 1123px;
      background: var(--paper-bg);
      color: var(--paper-text);
      padding: 40px 45px 45px 45px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border-radius: 14px;
      border: 2px solid #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: visible;
    }

    .chart-paper::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px dashed rgba(15, 23, 42, 0.25);
      border-radius: 8px;
      pointer-events: none;
    }

    .paper-inner {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      height: 980px;
      overflow: visible;
    }

    /* ENCABEZADO HOJA 1 */
    .chart-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
      padding-top: 10px;
      width: 100%;
    }

    /* ENCABEZADO HOJAS SIGUIENTES */
    .chart-header-subsequent {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 8px;
      margin-bottom: 4px;
      font-size: 0.85em;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      user-select: none;
    }

    .subsequent-title-ref {
      color: #64748b;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 500px;
    }

    .title-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .song-title-editable, .song-title-print {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.85em;
      text-transform: uppercase;
      text-align: center;
      color: #0f172a;
      letter-spacing: 2px;
      line-height: 1.3;
      padding: 4px 0;
      width: 100%;
    }

    .song-title-editable {
      border: none;
      outline: none;
      background: transparent;
    }

    .song-title-print {
      display: none;
    }

    .song-title-editable::placeholder { color: #cbd5e1; }

    .header-sub-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88em;
      font-weight: 600;
      color: #475569;
      min-height: 28px;
    }

    .sub-item-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .editable-sub {
      border: none;
      outline: none;
      background: transparent;
      color: #475569;
      font-weight: 600;
      font-size: 1em;
      line-height: 1.4;
      padding: 2px 0;
    }

    .editable-sub::placeholder { color: #cbd5e1; }

    .sub-print-text {
      display: none;
      color: #475569;
      font-weight: 600;
      font-size: 1em;
      line-height: 1.4;
    }

    .chart-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-badge {
      display: inline-block;
      align-self: flex-start;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
      font-size: 0.85em;
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
      border: none;
      outline: none;
      text-transform: uppercase;
    }

    .song2-subtitle {
      font-size: 1.1em;
      font-weight: 800;
      color: #0369a1;
      border-bottom: 2px solid #38bdf8;
      padding-bottom: 2px;
      margin: 12px 0 6px 0;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .measures-grid {
      display: flex;
      flex-wrap: wrap;
      border-left: 2px solid #0f172a;
    }

    .measure-box {
      height: 80px;
      border-right: 2px solid #0f172a;
      border-top: 2px solid #0f172a;
      border-bottom: 2px solid #0f172a;
      padding: 4px 6px;
      display: flex;
      position: relative;
      background: #fff;
      cursor: pointer;
      transition: background 0.2s ease;
      flex: 0 0 25%;
    }

    .measure-box.selected {
      background: #f0fdf4 !important;
      border-color: #16a34a !important;
      box-shadow: inset 0 0 0 1.5px #16a34a;
    }

    .measure-box.break-system {
      flex-basis: 100% !important;
      height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
    }

    .measure-main {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      height: 100%;
    }

    .chord-input {
      font-size: 1.15em;
      font-weight: 800;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      background: transparent;
    }

    /* CONTENEDOR VECTORIAL SVG DE BEATS */
    .rhythm-beats-container {
      width: 100%;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .beat-slot {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .beat-slot:hover {
      background: rgba(6, 182, 212, 0.12);
    }

    .beat-slot.active-beat {
      background: rgba(16, 185, 129, 0.2) !important;
      box-shadow: inset 0 0 0 1.5px #10b981;
      border-radius: 4px;
    }

    /* ESTILO DE SUB-ELEMENTOS SELECCIONABLES DENTRO DEL TIEMPO */
    .sub-item-target {
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .sub-item-target:hover {
      opacity: 0.7;
    }

    .sub-item-target.active-sub-item {
      outline: 2px dashed #06b6d4;
    }

    .beat-slot svg {
      width: 100%;
      height: 100%;
    }

    .band-annotation {
      position: absolute;
      top: -10px;
      right: 6px;
      font-size: 0.7em;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #bfdbfe;
      outline: none;
    }

    .time-sig-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-right: 4px;
      padding-right: 4px;
      border-right: 1.5px solid #0f172a;
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 0.95em;
      line-height: 0.88;
      color: #0f172a;
      user-select: none;
    }

    .chart-footer {
      border-top: 1.5px dashed #cbd5e1;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8em;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .footer-title-ref {
      text-transform: uppercase;
      color: #334155;
    }

    @media (max-width: 950px) {
      .studio-layout { grid-template-columns: 1fr; }
      .sheets-container { padding: 10px; }
      .chart-paper { width: 100%; height: auto; min-height: 1123px; }
      .toolbox-panel { position: static; }
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN SUPERIOR -->
  <div class="top-nav">
    <a href="../index.html" class="btn-back" id="btnBack">← HOME</a>
    
    <select class="lang-selector-mini" id="langSelector" onchange="changeLanguageManually(this.value)">
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
      <option value="pt">🇧🇷 Português</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="ja">🇯🇵 日本語</option>
    </select>
  </div>

  <div class="studio-layout">
    
    <!-- PANEL LATERAL DE CONTROL -->
    <div class="toolbox-panel">
      
      <div class="toolbox-section">
        <div class="toolbox-title" id="titleActions">⚡ Main Actions</div>
        
        <div class="download-dropdown" id="downloadDropdown">
          <button class="tool-btn primary" style="width:100%; text-align:center;" id="btnExportMain" onclick="toggleDownloadMenu(event)">📥 Download Chart ▾</button>
          <div class="download-menu">
            <button class="download-option" id="optDownloadPNG" onclick="exportAllPagesToPNG()">🖼️ Export as PNG Images</button>
            <button class="download-option" id="optDownloadPDF" onclick="exportAllPagesToPDF()">📄 Export as Single PDF File</button>
          </div>
        </div>

        <button class="tool-btn custom-btn" style="margin-top:6px;" id="btnAddPage" onclick="addNewPageManual()">📄 Add New Page</button>
        
        <div style="display:flex; gap:8px; margin-top:5px;">
          <button class="tool-btn" style="flex:1;" id="btnTranspDown" onclick="transposeAll(-1)">♭ -1 Semitone</button>
          <button class="tool-btn" style="flex:1;" id="btnTranspUp" onclick="transposeAll(1)">♯ +1 Semitone</button>
        </div>
      </div>

      <div class="toolbox-section">
        <div class="toolbox-title" id="titleTimeSig">⏱️ Time Signature</div>
        <select class="select-input" id="timeSignatureSelect">
          <option value="4/4" selected id="opt44">4/4 (Four-Four)</option>
          <option value="3/4" id="opt34">3/4 (Three-Four)</option>
          <option value="2/4" id="opt24">2/4 (Two-Four)</option>
          <option value="6/8" id="opt68">6/8 (Six-Eighths)</option>
          <option value="9/8" id="opt98">9/8 (Nine-Eighths)</option>
          <option value="12/8" id="opt128">12/8 (Twelve-Eighths)</option>
          <option value="2/2" id="opt22">2/2 (Cut Time)</option>
        </select>
        <button class="tool-btn" style="margin-top:2px; border-color:var(--accent-purple); color:#d8b4fe;" id="btnApplyTimeSig" onclick="applyTimeSignatureToSelected()">⏱️ Apply Time Sig from Selection</button>
      </div>

      <div class="toolbox-section">
        <div class="toolbox-title" id="titleSections">🏷️ Sections & Song 2</div>
        <button class="tool-btn custom-btn" style="width:100%; font-weight:700; margin-bottom:4px;" id="btnSubSong2" onclick="addSong2Subtitle()">➕ Song 2 / Subtitle</button>
        <div class="btn-grid">
          <button class="tool-btn custom-btn" id="btnSecEdit" onclick="addEditableSection()">✏️ EDITABLE</button>
          <button class="tool-btn" id="btnSecIntro" onclick="addSection(i18n[currentLang].secIntro)">+ INTRO</button>
          <button class="tool-btn" id="btnSecVerse" onclick="addSection(i18n[currentLang].secVerse)">+ VERSE</button>
          <button class="tool-btn" id="btnSecChorus" onclick="addSection(i18n[currentLang].secChorus)">+ CHORUS</button>
          <button class="tool-btn" id="btnSecBridge" onclick="addSection(i18n[currentLang].secBridge)">+ BRIDGE</button>
          <button class="tool-btn" id="btnSecSolo" onclick="addSection(i18n[currentLang].secSolo)">+ SOLO</button>
        </div>
      </div>

      <div class="toolbox-section">
        <div class="toolbox-title" id="titleMeasures">🎼 Measures & Structure</div>
        
        <button class="tool-btn primary" style="margin-bottom:6px; background:linear-gradient(135deg, #10b981, #06b6d4);" id="btnGroupSelected" onclick="groupSelectedInSystem()">🔗 Group Selected in 1 System</button>

        <div class="btn-grid">
          <button class="tool-btn" id="btnAdd4" onclick="addMultipleMeasures(4)">+ 4 Measures</button>
          <button class="tool-btn" id="btnAdd8" onclick="addMultipleMeasures(8)">+ 8 Measures</button>
        </div>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input type="number" id="customMeasureQty" value="12" min="1" max="100" class="select-input" style="width:70px; text-align:center;">
          <button class="tool-btn" style="flex:1;" id="btnAddN" onclick="addMultipleMeasures()">+ Custom N</button>
        </div>
        <div style="font-size:0.75em; color:var(--text-muted); margin-top:6px; margin-bottom:2px;" id="lblLocation">Position relative to selection:</div>
        <div class="btn-grid">
          <button class="tool-btn" id="btnInsertBefore" onclick="insertMeasure('before')">⬅️ Before</button>
          <button class="tool-btn" id="btnInsertAfter" onclick="insertMeasure('after')">➡️ After</button>
        </div>
        <button class="tool-btn" style="margin-top:6px; background:rgba(234,179,8,0.15); border-color:rgba(234,179,8,0.4); color:#fef08a;" id="btnLineBreak" onclick="toggleSystemBreak()">↵ Line Break (Group)</button>
        <button class="tool-btn" style="margin-top:4px; color:#fca5a5; border-color:rgba(239,68,68,0.3);" id="btnDelete" onclick="removeSelectedMeasure()">🗑️ Delete Selected (Shift+Click)</button>
      </div>

      <div class="toolbox-section">
        <div class="toolbox-title" id="titleAnnotations">📌 Band Cues</div>

    function initLanguage() {
      let savedLang = localStorage.getItem('preferred_lang');
      if (!savedLang) {
        const urlParams = new URLSearchParams(window.location.search);
        savedLang = urlParams.get('lang');

      currentLang = savedLang;

      applyLanguage(currentLang);

    function changeLanguageManually(lang) {

    function toggleDownloadMenu(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('downloadDropdown');
      dropdown.classList.toggle('active');
    }

    document.addEventListener('click', () => {
      const dropdown = document.getElementById('downloadDropdown');
      if (dropdown) dropdown.classList.remove('active');
    });

    function handleMeasureClick(el, event) {
      if (el.classList.contains('break-system')) return;

      const allMeasures = Array.from(document.querySelectorAll('.measure-box:not(.break-system)'));

      if (event && event.shiftKey && lastSelectedMeasure) {
        const startIdx = allMeasures.indexOf(lastSelectedMeasure);
        const endIdx = allMeasures.indexOf(el);

        const min = Math.min(startIdx, endIdx);
        const max = Math.max(startIdx, endIdx);

        clearSelections();
        for (let i = min; i <= max; i++) {
          allMeasures[i].classList.add('selected');
          selectedMeasures.push(allMeasures[i]);
        }
      } else {
        clearSelections();
        el.classList.add('selected');
        selectedMeasures = [el];
        lastSelectedMeasure = el;

        const firstBeat = el.querySelector('.beat-slot');
        if (firstBeat) selectBeatSlot(firstBeat, null, 0);
      }
    }

    function clearSelections() {
      document.querySelectorAll('.measure-box.selected').forEach(m => m.classList.remove('selected'));
      document.querySelectorAll('.beat-slot.active-beat').forEach(b => b.classList.remove('active-beat'));
      selectedMeasures = [];
      activeBeatSlot = null;
      activeSubIndex = 0;
    }

    function selectBeatSlot(slotEl, e, subIdx = 0) {
      if (e) e.stopPropagation();
      document.querySelectorAll('.beat-slot.active-beat').forEach(b => b.classList.remove('active-beat'));
      slotEl.classList.add('active-beat');
      activeBeatSlot = slotEl;
      activeSubIndex = subIdx;

      const measureBox = slotEl.closest('.measure-box');
      if (measureBox) {
        document.querySelectorAll('.measure-box.selected').forEach(m => m.classList.remove('selected'));
        measureBox.classList.add('selected');
        selectedMeasures = [measureBox];
        lastSelectedMeasure = measureBox;
      }
    }

    // INTERRUPTOR DE CLIC EN SUB-ELEMENTO INDIVIDUAL DENTRO DEL SVG
    function handleSubItemClick(slotEl, subIdx, e) {
      if (e) e.stopPropagation();
      selectBeatSlot(slotEl, null, subIdx);
      renderBeatSlot(slotEl);
    }

    // ESTRUCTURA DE DATOS PARA UN BEAT: Array de figuras/silencios por pulso
    // por defecto 1 tiempo = ['q']
    function getBeatData(slotEl) {
      if (!slotEl.dataset.items) {
        slotEl.dataset.items = JSON.stringify([{ type: 'q', dot: false, tie: false }]);
      }
      return JSON.parse(slotEl.dataset.items);
    }

    function setBeatData(slotEl, items) {
      slotEl.dataset.items = JSON.stringify(items);
      renderBeatSlot(slotEl);
    }

    // DIBUJO RÍTMICO SVG DE SUBDIVISIONES COMBINADAS
    function renderBeatSlot(slotEl) {
      const items = getBeatData(slotEl);
      const totalItems = items.length;
      
      let svgHTML = `<svg viewBox="0 0 40 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;
      const step = 40 / (totalItems + 1);
      const stemYBottom = 38;

      let hasSixteenthBeams = false;
      let hasEighthBeams = false;

      items.forEach((item, i) => {
        const x = step * (i + 1);
        const isSelected = (i === activeSubIndex && slotEl.classList.contains('active-beat'));
        const type = item.type;
        const isRest = type.startsWith('r');
        const pureType = isRest ? type.substring(1) : type;

        if (pureType === '16' && !isRest) hasSixteenthBeams = true;
        if ((pureType === '8' || pureType === '16') && !isRest) hasEighthBeams = true;

        // Zona interactiva del sub-elemento
        svgHTML += `<g class="sub-item-target" onclick="handleSubItemClick(this.closest('.beat-slot'), ${i}, event)">`;

        if (isSelected) {
          svgHTML += `<rect x="${x - 4.5}" y="6" width="9" height="32" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="2,2" rx="2" />`;
        }

        if (isRest) {
          if (pureType === 'q') {
            svgHTML += `<path d="M ${x-2} 10 L ${x+3} 16 L ${x-3} 22 L ${x+2} 28 C ${x-4} 30 ${x-4} 34 ${x+1} 34" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" />`;
          } else if (pureType === '8') {
            svgHTML += `<circle cx="${x-2}" cy="16" r="1.8" fill="#1e293b" />`;
            svgHTML += `<path d="M ${x-2} 16 Q ${x+2} 14 ${x+1} 20 L ${x-3} 32" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />`;
          } else if (pureType === '16') {
            svgHTML += `<circle cx="${x-2}" cy="14" r="1.5" fill="#1e293b" />`;
            svgHTML += `<circle cx="${x-3}" cy="20" r="1.5" fill="#1e293b" />`;
            svgHTML += `<path d="M ${x-2} 14 Q ${x+2} 12 ${x+1} 18 L ${x-3} 32" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />`;
          } else if (pureType === 'w') {
            svgHTML += `<rect x="${x - 5}" y="12" width="10" height="5" fill="#1e293b" />`;
          } else if (pureType === 'h') {
            svgHTML += `<rect x="${x - 5}" y="18" width="10" height="5" fill="#1e293b" />`;
          }
        } else {
          // Slash inclinado a la derecha
          svgHTML += `<line x1="${x - 3.5}" y1="26" x2="${x + 3.5}" y2="10" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" />`;

          // Plica desde el extremo izquierdo superior del slash (x-3.5, y=26)
          if (pureType === '8' || pureType === '16') {
            svgHTML += `<line x1="${x - 3.5}" y1="26" x2="${x - 3.5}" y2="${stemYBottom}" stroke="#1e293b" stroke-width="2" />`;
          }
        }

        if (item.dot) {
          svgHTML += `<circle cx="${x + 7}" cy="18" r="1.8" fill="#1e293b" />`;
        }

        if (item.tie) {
          svgHTML += `<path d="M ${x - 4} 28 Q ${x} 34 ${x + 4} 28" fill="none" stroke="#1e293b" stroke-width="1.8" />`;
        }

        svgHTML += `</g>`;
      });

      // Dibujo de Barras superiores / de unión (Beams)
      if (totalItems >= 2 && hasEighthBeams) {
        const xFirst = step * 1 - 3.5;
        const xLast = step * totalItems - 3.5;
        svgHTML += `<line x1="${xFirst}" y1="${stemYBottom}" x2="${xLast}" y2="${stemYBottom}" stroke="#1e293b" stroke-width="3" />`;

        if (hasSixteenthBeams) {
          svgHTML += `<line x1="${xFirst}" y1="${stemYBottom - 4}" x2="${xLast}" y2="${stemYBottom - 4}" stroke="#1e293b" stroke-width="2.5" />`;
        }
      }

      svgHTML += `</svg>`;
      slotEl.innerHTML = svgHTML;
    }

    // APLICAR RITMO O SUBDIVISIÓN AL ELEMENTO ACTIVO
    function applySubdivisionRhythm(type) {
      if (!activeBeatSlot) return;

      let items = getBeatData(activeBeatSlot);

      if (type === '16' || type === 'r16') {
        // Subdivisión de Semicorcheas (4 elementos)
        items = [
          { type: type, dot: false, tie: false },
          { type: type, dot: false, tie: false },
          { type: type, dot: false, tie: false },
          { type: type, dot: false, tie: false }
        ];
        activeSubIndex = 0;
      } else if (type === '8' || type === 'r8') {
        // Subdivisión de Corcheas (2 elementos)
        items = [
          { type: type, dot: false, tie: false },
          { type: type, dot: false, tie: false }
        ];
        activeSubIndex = 0;
      } else {
        // Reemplazar o cambiar solo el sub-elemento seleccionado
        if (items[activeSubIndex]) {
          items[activeSubIndex].type = type;
        } else {
          items = [{ type: type, dot: false, tie: false }];
          activeSubIndex = 0;
        }
      }

      setBeatData(activeBeatSlot, items);
    }

    function toggleSubdivisionDot() {
      if (!activeBeatSlot) return;
      let items = getBeatData(activeBeatSlot);
      if (items[activeSubIndex]) {
        items[activeSubIndex].dot = !items[activeSubIndex].dot;
        setBeatData(activeBeatSlot, items);
      }
    }

    function toggleSubdivisionTie() {
      if (!activeBeatSlot) return;
      let items = getBeatData(activeBeatSlot);
      if (items[activeSubIndex]) {
        items[activeSubIndex].tie = !items[activeSubIndex].tie;
        setBeatData(activeBeatSlot, items);
      }
    }

    function resetMeasureRhythm() {
      if (selectedMeasures.length > 0) {
        selectedMeasures.forEach(m => {
          const slots = m.querySelectorAll('.beat-slot');
          slots.forEach(b => {
            setBeatData(b, [{ type: 'q', dot: false, tie: false }]);
          });
          if (slots[0]) selectBeatSlot(slots[0], null, 0);
        });
      }
    }

    // --- ESCUCHADOR DE TECLADO NUMÉRICO ---
    window.addEventListener('keydown', (e) => {
      const isEditingInput = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.isContentEditable);
      if (isEditingInput) return;

      const isCtrl = e.ctrlKey || e.metaKey;

      if (isCtrl) {
        if (e.key === '7') { e.preventDefault(); applySubdivisionRhythm('rw'); }
        else if (e.key === '6') { e.preventDefault(); applySubdivisionRhythm('rh'); }
        else if (e.key === '5') { e.preventDefault(); applySubdivisionRhythm('rq'); }
        else if (e.key === '4') { e.preventDefault(); applySubdivisionRhythm('r8'); }
        else if (e.key === '3') { e.preventDefault(); applySubdivisionRhythm('r16'); }
      } else {
        if (e.key === '7') { applySubdivisionRhythm('w'); }
        else if (e.key === '6') { applySubdivisionRhythm('h'); }
        else if (e.key === '5') { applySubdivisionRhythm('q'); }
        else if (e.key === '4') { applySubdivisionRhythm('8'); }
        else if (e.key === '3') { applySubdivisionRhythm('16'); }
        else if (e.key === '.') { toggleSubdivisionDot(); }
        else if (e.key === '+' || e.key === '=') { toggleSubdivisionTie(); }
      }
    });

    function groupSelectedInSystem() {
      const dict = i18n[currentLang] || i18n['en'];
      if (selectedMeasures.length === 0) {
        alert(dict.alertGroupSelect);
        return;
      }

      const percent = (100 / selectedMeasures.length).toFixed(2);
      selectedMeasures.forEach(m => {
        m.style.flex = `0 0 ${percent}%`;
      });

      const last = selectedMeasures[selectedMeasures.length - 1];
      if (last && last.parentNode) {
        const breakEl = document.createElement('div');
        breakEl.className = 'measure-box break-system';
        last.parentNode.insertBefore(breakEl, last.nextSibling);
      }

      clearSelections();
    }

    function createStackedTimeSigHTML(timeSigStr) {
      const parts = timeSigStr.split('/');
      if (parts.length === 2) {
        return `<div class="time-sig-stack"><span>${parts[0]}</span><span>${parts[1]}</span></div>`;
      }
      return `<div class="time-sig-stack"><span>${timeSigStr}</span></div>`;
    }

    function applyTimeSignatureToSelected() {
      const val = document.getElementById('timeSignatureSelect').value;
      if (selectedMeasures.length === 0) {
        const dict = i18n[currentLang] || i18n['en'];
        alert(dict.alertSelectMeasure);
        return;
      }

      const startMeasure = selectedMeasures[0];
      const allMeasures = Array.from(document.querySelectorAll('.measure-box:not(.break-system)'));
      const startIdx = allMeasures.indexOf(startMeasure);

      if (startIdx !== -1) {
        if (startIdx === 0) {
          const headerInput = document.getElementById('headerTimeSigInput');
          if (headerInput) headerInput.value = val;
        }

        let stackEl = startMeasure.querySelector('.time-sig-stack');
        if (!stackEl) {
          const temp = document.createElement('div');
          temp.innerHTML = createStackedTimeSigHTML(val);
          stackEl = temp.firstElementChild;
          startMeasure.insertBefore(stackEl, startMeasure.firstChild);
        } else {
          stackEl.outerHTML = createStackedTimeSigHTML(val);
        }
      }

      if (typeof gtag === 'function') {
        gtag('event', 'change_time_signature_forward', { 'time_sig': val });
      }
    }

    function updateFooterTitle(val) {
      const dict = i18n[currentLang] || i18n['en'];
      const text = val.trim() !== '' ? val.toUpperCase() : dict.untitledChart;
      document.querySelectorAll('.footer-title-ref').forEach(el => el.innerText = text);
      document.querySelectorAll('.subsequent-title-ref').forEach(el => el.innerText = text);
    }

    function addSong2Subtitle() {
      const dict = i18n[currentLang] || i18n['en'];
      const targetMeasure = selectedMeasures.length > 0 ? selectedMeasures[0] : null;

      const sub = document.createElement('div');
      sub.className = 'song2-subtitle';
      sub.contentEditable = 'true';
      sub.innerText = dict.song2Placeholder;

      if (targetMeasure && targetMeasure.parentNode) {
        const block = targetMeasure.closest('.section-block');
        if (block) {
          block.parentNode.insertBefore(sub, block);
        }
      } else {
        const content = getCurrentPageContent();
        content.appendChild(sub);
      }
    }

    function addNewPageManual() {
      const pages = document.querySelectorAll('.chart-paper');
      const newPage = createNewPageElement(pages.length + 1);
      document.getElementById('sheetsContainer').appendChild(newPage);
      
      const dict = i18n[currentLang] || i18n['en'];
      const content = newPage.querySelector('.chart-content');
      
      const newBlock = document.createElement('div');
      newBlock.className = 'section-block';
      const grid = document.createElement('div');
      grid.className = 'measures-grid';
      for (let i = 0; i < 4; i++) {
        grid.appendChild(createMeasureElement());
      }
      newBlock.innerHTML = `<span class="section-badge" contenteditable="true">${dict.secNew}</span>`;
      newBlock.appendChild(grid);
      content.appendChild(newBlock);

      initAllBeatMeasures();
      updateTotalPagesCounter();
    }

    function getCurrentPageContent() {
      const pages = document.querySelectorAll('.chart-paper');
      const lastPage = pages[pages.length - 1];
      return lastPage.querySelector('.chart-content');
    }

    function cleanupEmptyPages() {
      const pages = Array.from(document.querySelectorAll('.chart-paper'));
      for (let i = pages.length - 1; i > 0; i--) {
        let page = pages[i];
        let measures = page.querySelectorAll('.measure-box:not(.break-system)');
        if (measures.length === 0) {
          page.parentNode.removeChild(page);
        } else {
          break; 
        }
      }
      updateTotalPagesCounter();
    }

    function createNewPageElement(pageNum) {
      const dict = i18n[currentLang] || i18n['en'];
      const titleText = document.getElementById('songTitleInput').value.toUpperCase() || dict.untitledChart;

      const newPaper = document.createElement('div');
      newPaper.className = 'chart-paper';
      newPaper.id = `paper-page-${pageNum}`;

      newPaper.innerHTML = `
        <div class="paper-inner">
          <div class="chart-header-subsequent">
            <span class="subsequent-title-ref">${titleText}</span>
            <span>(CONT.)</span>
          </div>
          <div class="chart-content"></div>
        </div>
        <div class="chart-footer">
          <div class="footer-title-ref">${titleText}</div>
          <div class="page-num-ref">${dict.pageLabel} ${pageNum} / ${pageNum}</div>
        </div>
      `;
      return newPaper;
    }

    function updateTotalPagesCounter() {
      const dict = i18n[currentLang] || i18n['en'];
      const total = document.querySelectorAll('.chart-paper').length;
      document.querySelectorAll('.page-num-ref').forEach((el, idx) => {
        el.innerText = `${dict.pageLabel} ${idx + 1} / ${total}`;
      });
    }

    function addEditableSection() {
      const dict = i18n[currentLang] || i18n['en'];
      addSection(dict.secNew, true);
    }

    function createMeasureElement() {
      const dict = i18n[currentLang] || i18n['en'];
      const box = document.createElement('div');
      box.className = 'measure-box';
      box.onclick = function(e) { handleMeasureClick(this, e); };
      box.innerHTML = `
        <div class="measure-main">
          <input type="text" class="chord-input" placeholder="${dict.chordPlaceholder}">
          <div class="rhythm-beats-container"></div>
        </div>
      `;
      return box;
    }

    function addSection(title, isEditable = false) {
      const content = getCurrentPageContent();
      const newBlock = document.createElement('div');
      newBlock.className = 'section-block';

      const grid = document.createElement('div');
      grid.className = 'measures-grid';
      for (let i = 0; i < 4; i++) {
        grid.appendChild(createMeasureElement());
      }

      newBlock.innerHTML = `<span class="section-badge" contenteditable="true">${title}</span>`;
      newBlock.appendChild(grid);
      content.appendChild(newBlock);

      initAllBeatMeasures();
    }

    function addMultipleMeasures(qty) {
      const count = qty || parseInt(document.getElementById('customMeasureQty').value) || 1;
      const content = getCurrentPageContent();
      let targetGrid;

      const blocks = content.querySelectorAll('.section-block');
      if (blocks.length > 0) {
        targetGrid = blocks[blocks.length - 1].querySelector('.measures-grid');
      } else {
        const dict = i18n[currentLang] || i18n['en'];
        addSection(dict.secNew);
        const newBlocks = content.querySelectorAll('.section-block');
        targetGrid = newBlocks[newBlocks.length - 1].querySelector('.measures-grid');
      }

      for (let i = 0; i < count; i++) {
        targetGrid.appendChild(createMeasureElement());
      }

      initAllBeatMeasures();
    }

    function insertMeasure(position) {
      const dict = i18n[currentLang] || i18n['en'];
      if (selectedMeasures.length === 0) {
        alert(dict.alertSelectMeasure);
        return;
      }

      const target = selectedMeasures[0];
      const newBox = createMeasureElement();
      if (position === 'before') {
        target.parentNode.insertBefore(newBox, target);
      } else {
        target.parentNode.insertBefore(newBox, target.nextSibling);
      }

      initAllBeatMeasures();
      handleMeasureClick(newBox, null);
    }

    function toggleSystemBreak() {
      const dict = i18n[currentLang] || i18n['en'];
      if (selectedMeasures.length === 0) {
        alert(dict.alertSelectBreak);
        return;
      }
      const target = selectedMeasures[selectedMeasures.length - 1];
      const grid = target.parentNode;
      const breakEl = document.createElement('div');
      breakEl.className = 'measure-box break-system';
      grid.insertBefore(breakEl, target.nextSibling);
    }

    function removeSelectedMeasure() {
      if (selectedMeasures.length > 0) {
        selectedMeasures.forEach(m => {
          if (m && m.parentNode) {
            m.parentNode.removeChild(m);
          }
        });
        clearSelections();
        lastSelectedMeasure = null;
        cleanupEmptyPages();
      }
    }

    function addAnnotation(text, isEditable = false) {
      const dict = i18n[currentLang] || i18n['en'];
      if (selectedMeasures.length === 0) {
        alert(dict.alertSelectNote);
        return;
      }
      const target = selectedMeasures[0];
      let badge = target.querySelector('.band-annotation');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'band-annotation';
        badge.contentEditable = 'true';
        target.appendChild(badge);
      }
      badge.innerText = text;
    }

    const notesChromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'G', 'G#', 'A', 'A#', 'B'];
    const notesFlats = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

    function transposeChord(chord, semitones) {
      return chord.replace(/[A-G][#b]?/g, (match) => {
        let index = notesChromatic.indexOf(match);
        if (index === -1) index = notesFlats.indexOf(match);
        if (index === -1) return match;
        let newIndex = (index + semitones + 12) % 12;
        return notesChromatic[newIndex];
      });
    }

    function transposeAll(semitones) {
      document.querySelectorAll('.chord-input').forEach(input => {
        if (input.value.trim() !== '') {
          input.value = transposeChord(input.value, semitones);
        }
      });

      if (typeof gtag === 'function') {
        gtag('event', 'transpose_chart', { 'semitones': semitones });
      }
    }

    const RENDER_OPTIONS = {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      scrollX: 0,
      scrollY: 0,
      width: 794,
      height: 1123,
      windowWidth: 1200
    };

    function prepareSubItem(inputId, printId, wrapperId, prefix = '') {
      const inputEl = document.getElementById(inputId);
      const printEl = document.getElementById(printId);
      const wrapperEl = document.getElementById(wrapperId);
      if (!inputEl || !printEl || !wrapperEl) return;

      const val = inputEl.value.trim();
      inputEl.style.display = 'none';

      if (val !== '') {
        printEl.innerText = prefix + val;
        printEl.style.display = 'inline';
        wrapperEl.style.display = 'inline-flex';
      } else {
        printEl.style.display = 'none';
        wrapperEl.style.display = 'none';
      }
    }

    function prepareForRender() {
      clearSelections();
      document.body.classList.add('exporting-mode');
      
      const titleInput = document.getElementById('songTitleInput');
      const titlePrint = document.getElementById('songTitlePrint');
      if (titleInput && titlePrint) {
        const val = titleInput.value.trim();
        if (val !== '') {
          titlePrint.innerText = val;
        } else {
          titlePrint.innerText = '';
        }
        titleInput.style.display = 'none';
        titlePrint.style.display = 'block';
      }

      prepareSubItem('artistInput', 'printArtist', 'wrapArtist');
      prepareSubItem('styleInput', 'printStyle', 'wrapStyle');
      prepareSubItem('headerTimeSigInput', 'printTimeSig', 'wrapTimeSig');
      prepareSubItem('bpmInput', 'printBPM', 'wrapBPM');
    }

    function restoreAfterRender() {
      document.body.classList.remove('exporting-mode');
      
      const titleInput = document.getElementById('songTitleInput');
      const titlePrint = document.getElementById('songTitlePrint');
      if (titleInput && titlePrint) {
        titleInput.style.display = 'block';
        titlePrint.style.display = 'none';
      }

      ['wrapArtist', 'wrapStyle', 'wrapTimeSig', 'wrapBPM'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'inline-flex';
      });

      ['artistInput', 'styleInput', 'headerTimeSigInput', 'bpmInput'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'inline-block';
      });

      ['printArtist', 'printStyle', 'printTimeSig', 'printBPM'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    }

    function exportAllPagesToPNG() {
      if (typeof gtag === 'function') {
        gtag('event', 'export_chart_png', {
          'song_title': document.getElementById('songTitleInput').value || 'Sin Titulo',
          'total_pages': document.querySelectorAll('.chart-paper').length
        });
      }

      prepareForRender();

      document.fonts.ready.then(() => {
        const papers = document.querySelectorAll('.chart-paper');
        papers.forEach((paper, idx) => {
          html2canvas(paper, RENDER_OPTIONS).then(canvas => {
            const link = document.createElement('a');
            const title = document.getElementById('songTitleInput').value || 'chart';
            link.download = `${title.toLowerCase().replace(/\s+/g, '-')}-page-${idx + 1}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            restoreAfterRender();
          });
        });
      });
    }

    function exportAllPagesToPDF() {
      if (typeof gtag === 'function') {
        gtag('event', 'export_chart_pdf', {
          'song_title': document.getElementById('songTitleInput').value || 'Sin Titulo',
          'total_pages': document.querySelectorAll('.chart-paper').length
        });
      }

      prepareForRender();

      document.fonts.ready.then(async () => {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const papers = Array.from(document.querySelectorAll('.chart-paper'));
        const title = document.getElementById('songTitleInput').value || 'chart';

        for (let i = 0; i < papers.length; i++) {
          const canvas = await html2canvas(papers[i], RENDER_OPTIONS);
          const imgData = canvas.toDataURL('image/jpeg', 0.98);

          if (i > 0) pdf.addPage();
          pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
        }

        pdf.save(`${title.toLowerCase().replace(/\s+/g, '-')}.pdf`);
        restoreAfterRender();
      });
    }

    function initAllBeatMeasures() {
      document.querySelectorAll('.rhythm-beats-container').forEach(c => {
        if (!c.firstChild) {
          c.innerHTML = '';
          for (let i = 0; i < 4; i++) {
            const slot = document.createElement('div');
            slot.className = 'beat-slot';
            slot.onclick = function(e) { selectBeatSlot(this, e, 0); };
            setBeatData(slot, [{ type: 'q', dot: false, tie: false }]);
            c.appendChild(slot);
          }
        }
      });
    }

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedMeasures.length > 0) {
        const isEditingInput = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.isContentEditable);
        if (!isEditingInput) {
          e.preventDefault();
          removeSelectedMeasure();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      initLanguage();
      initAllBeatMeasures();
    });
  </script>
</body>
</html>
