<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Chart Studio</title>
  
  <!-- Google Analytics GA4 Base -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q3DTLYSJMH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-Q3DTLYSJMH');
  </script>

  <!-- Tipografía Bungee exacta para el título e Inter para el cuerpo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- html2canvas para exportar a PNG y jsPDF para exportar a PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-dark: #090c15;
      --panel-bg: rgba(18, 22, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-purple: #a855f7;
      --accent-cyan: #06b6d4;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --paper-bg: #ffffff;
      --paper-text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BARRA SUPERIOR CON SELECTOR DE IDIOMA */
    .top-nav {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-back:hover {
      color: #fff;
      border-color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.2);
      transform: translateX(-3px);
    }

    .lang-selector-mini {
      background: rgba(18, 22, 38, 0.85);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8em;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* LAYOUT STUDIO */
    .studio-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* PANEL LATERAL DE CONTROL */
    .toolbox-panel {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 20px;
    }

    .toolbox-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolbox-title {
      font-size: 0.8em;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-light);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tool-btn:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: var(--accent-purple);
      color: #fff;
    }

    .tool-btn.primary {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      color: #fff;
      font-weight: 700;
    }

    .tool-btn.primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .tool-btn.pdf-btn {
      background: linear-gradient(135deg, #ef4444, #f97316);
      border: none;
      color: #fff;
      font-weight: 700;
    }

    .tool-btn.pdf-btn:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .tool-btn.custom-btn {
      border: 1px dashed var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .select-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85em;
      outline: none;
    }

    /* CONTENEDOR MULTI-HOJA A4 */
    .sheets-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      background: #e2e8f0;
      padding: 30px;
      border-radius: 20px;
      align-items: center;
    }

    .chart-paper {
      width: 794px;
      height: 1123px;
      max-height: 1123px;
      background: var(--paper-bg);
      color: var(--paper-text);
      padding: 45px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border-radius: 14px;
      border: 2px solid #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .chart-paper::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px dashed rgba(15, 23, 42, 0.25);
      border-radius: 8px;
      pointer-events: none;
    }

    .paper-inner {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      height: 980px;
      overflow: hidden;
    }

    /* ENCABEZADO HOJA 1 */
    .chart-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
      padding-top: 10px;
    }

    /* ENCABEZADO HOJAS SIGUIENTES */
    .chart-header-subsequent {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 8px;
      margin-bottom: 4px;
      font-size: 0.85em;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      user-select: none;
    }

    .subsequent-title-ref {
      color: #64748b;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 500px;
    }

    .song-title-editable {
      font-family: 'Bungee', cursive, sans-serif;
      font-size: 1.85em;
      text-transform: uppercase;
      text-align: center;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      background: transparent;
      letter-spacing: 1px;
      line-height: 1.2;
      padding-top: 4px;
    }

    .song-title-editable::placeholder { color: #cbd5e1; }

    .header-sub-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88em;
      font-weight: 600;
      color: #475569;
    }

    .editable-sub {
      border: none;
      outline: none;
      background: transparent;
      color: #334155;
      font-weight: 600;
      font-size: 1em;
    }

    .editable-sub::placeholder { color: #cbd5e1; }

    .chart-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-badge {
      display: inline-block;
      align-self: flex-start;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
      font-size: 0.85em;
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
      border: none;
      outline: none;
      text-transform: uppercase;
    }

    .song2-subtitle {
      font-size: 1.1em;
      font-weight: 800;
      color: #0369a1;
      border-bottom: 2px solid #38bdf8;
      padding-bottom: 2px;
      margin: 12px 0 6px 0;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .measures-grid {
      display: flex;
      flex-wrap: wrap;
      border-left: 2px solid #0f172a;
    }

    .measure-box {
      height: 72px;
      border-right: 2px solid #0f172a;
      border-top: 2px solid #0f172a;
      border-bottom: 2px solid #0f172a;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: #fff;
      cursor: pointer;
      transition: background 0.2s ease;
      flex: 0 0 25%;
    }

    .measure-box.selected {
      background: #f0fdf4 !important;
      border-color: #16a34a !important;
      box-shadow: inset 0 0 0 1px #16a34a;
    }

    .measure-box.break-system {
      flex-basis: 100% !important;
      height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
    }

    .chord-input {
      font-size: 1.15em;
      font-weight: 800;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      background: transparent;
    }

    .rhythm-slashes {
      display: flex;
      justify-content: space-around;
      align-items: center;
      color: #64748b;
      font-size: 1.15em;
      user-select: none;
      font-weight: 800;
      width: 100%;
    }

    .rhythm-slashes span {
      display: inline-block;
      letter-spacing: -1px;
    }

    .band-annotation {
      position: absolute;
      top: -10px;
      right: 6px;
      font-size: 0.7em;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #bfdbfe;
      outline: none;
    }

    /* BADGE DE MÉTRICA VISIBLE EN COMPÁS DE CAMBIO */
    .time-sig-badge {
      position: absolute;
      bottom: 6px;
      left: 6px;
      font-size: 0.75em;
      font-weight: 800;
      color: #0f172a;
      background: #e2e8f0;
      border: 1px solid #64748b;
      padding: 1px 5px;
      border-radius: 4px;
      user-select: none;
      outline: none;
    }

    .chart-footer {
      border-top: 1.5px dashed #cbd5e1;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8em;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .footer-title-ref {
      text-transform: uppercase;
      color: #334155;
    }

    @media (max-width: 950px) {
      .studio-layout { grid-template-columns: 1fr; }
      .sheets-container { padding: 10px; }
      .chart-paper { width: 100%; height: auto; min-height: 1123px; }
      .toolbox-panel { position: static; }
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN SUPERIOR -->
  <div class="top-nav">
    <a href="../index.html" class="btn-back" id="btnBack">← HOME</a>
    
    <select class="lang-selector-mini" id="langSelector" onchange="changeLanguageManually(this.value)">
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
      <option value="pt">🇧🇷 Português</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="ja">🇯🇵 日本語</option>
    </select>
  </div>

  <div class="studio-layout">
    
    <!-- PANEL LATERAL DE CONTROL -->
    <div class="toolbox-panel">
      
      <div class="toolbox-section">
        <div class="toolbox-title" id="titleActions">⚡ Main Actions</div>
        
        <div style="display:flex; flex-direction:column; gap:6px;">
          <button class="tool-btn primary" id="btnExportPNG" onclick="exportAllPagesToPNG()">📥 Download All (PNG)</button>
          <button class="tool-btn pdf-btn" id="btnExportPDF" onclick="exportAllPagesToPDF()">📄 Download All (PDF)</button>
        </div>

        <button class="tool-btn custom-btn" style="margin-top:6px;" id="btnAddPage" onclick="addNewPageManual()">📄 Add New Page</button>
        
        <div style="display:flex; gap:8px; margin-top:5px;">
          <button class="tool-btn" style="flex:1;" id="btnTranspDown" onclick="transposeAll(-1)">♭ -1 Semitone</button>
          <button class="tool-btn" style="flex:1;" id="btnTranspUp" onclick="transposeAll(1)">♯ +1 Semitone</button>
        </div>
      </div>

      <div class="toolbox-section">
        <div class="toolbox-title" id="titleTimeSig">⏱️ Time Signature</div>
        <select class="select-input" id="timeSignatureSelect">
          <option value="4/4" selected id="opt44">4/4 (Four-Four)</option>
          <option value="3/4" id="opt34">3/4 (Three-Four)</option>
          <option value="2/4" id="opt24">2/4 (Two-Four)</option>
          <option value="6/8" id="opt68">6/8 (Six-Eighths)</option>
          <option value="9/8" id="opt98">9/8 (Nine-Eighths)</option>
          <option value="12/8" id="opt128">12/8 (Twelve-Eighths)</option>
          <option value="2/2" id="opt22">2/2 (Cut Time)</option>
        </select>
        <button class="tool-btn" style="margin-top:2px; border-color:var(--accent-purple); color:#d8b4fe;" id="btnApplyTimeSig" onclick="applyTimeSignatureToSelected()">⏱️ Apply Time Sig from Selection</button>
      </div>

      <div class="toolbox-section">
        <div class="toolbox-title" id="titleSections">🏷️ Sections & Song 2</div>
        <button class="tool-btn custom-btn" style="width:100%; font-weight:700; margin-bottom:4px;" id="btnSubSong2" onclick="addSong2Subtitle()">➕ Song 2 / Subtitle</button>
        <div class="btn-grid">
          <button class="tool-btn custom-btn" id="btnSecEdit" onclick="addEditableSection()">✏️ EDITABLE</button>
          <button class="tool-btn" id="btnSecIntro" onclick="addSection(i18n[currentLang].secIntro)">+ INTRO</button>
          <button class="tool-btn" id="btnSecVerse" onclick="addSection(i18n[currentLang].secVerse)">+ VERSE</button>
          <button class="tool-btn" id="btnSecChorus" onclick="addSection(i18n[currentLang].secChorus)">+ CHORUS</button>
          <button class="tool-btn" id="btnSecBridge" onclick="addSection(i18n[currentLang].secBridge)">+ BRIDGE</button>
          <button class="tool-btn" id="btnSecSolo" onclick="addSection(i18n[currentLang].secSolo)">+ SOLO</button>
        </div>
      </div>

      <div class="toolbox-section">
        <div class="toolbox-title" id="titleMeasures">🎼 Measures & Structure</div>
        
        <button class="tool-btn primary" style="margin-bottom:6px; background:linear-gradient(135deg, #10b981, #06b6d4);" id="btnGroupSelected" onclick="groupSelectedInSystem()">🔗 Group Selected in 1 System</button>

        <div class="btn-grid">
          <button class="tool-btn" id="btnAdd4" onclick="addMultipleMeasures(4)">+ 4 Measures</button>
          <button class="tool-btn" id="btnAdd8" onclick="addMultipleMeasures(8)">+ 8 Measures</button>
        </div>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input type="number" id="customMeasureQty" value="12" min="1" max="100" class="select-input" style="width:70px; text-align:center;">
          <button class="tool-btn" style="flex:1;" id="btnAddN" onclick="addMultipleMeasures()">+ Custom N</button>
        </div>
        <div style="font-size:0.75em; color:var(--text-muted); margin-top:6px; margin-bottom:2px;" id="lblLocation">Position relative to selection:</div>
        <div class="btn-grid">
          <button class="tool-btn" id="btnInsertBefore" onclick="insertMeasure('before')">⬅️ Before</button>
          <button class="tool-btn" id="btnInsertAfter" onclick="insertMeasure('after')">➡️ After</button>
        </div>
        <button class="tool-btn" style="margin-top:6px; background:rgba(234,179,8,0.15); border-color:rgba(234,179,8,0.4); color:#fef08a;" id="btnLineBreak" onclick="toggleSystemBreak()">↵ Line Break (Group)</button>
        <button class="tool-btn" style="margin-top:4px; color:#fca5a5; border-color:rgba(239,68,68,0.3);" id="btnDelete" onclick="removeSelectedMeasure()">🗑️ Delete Selected (Shift+Click)</button>
      </div>

      <div class="toolbox-section">
        <div class="toolbox-title" id="titleAnnotations">📌 Band Cues</div>
        <button class="tool-btn custom-btn" id="btnCustomNote" onclick="addAnnotation(i18n[currentLang].noteDefault, true)">✏️ Custom Note</button>
        <div class="btn-grid" style="margin-top:6px;">
          <button class="tool-btn" id="btnBandIn" onclick="addAnnotation(i18n[currentLang].bandIn)">Band IN</button>
          <button class="tool-btn" id="btnTutti" onclick="addAnnotation('Tutti')">Tutti</button>

          <button class="tool-btn" id="btnCorte" onclick="addAnnotation(i18n[currentLang].corte)">Break / Cut</button>
          <button class="tool-btn" id="btnPadOnly" onclick="addAnnotation('Pad Only')">Pad Only</button>
        </div>
      </div>

    </div>

    <!-- CONTENEDOR MULTI-PÁGINA A4 -->
    <div class="sheets-container" id="sheetsContainer">
      
      <!-- PÁGINA 1 -->
      <div class="chart-paper" id="paper-page-1">
        <div class="paper-inner">
          <div class="chart-header">
            <input type="text" class="song-title-editable" id="songTitleInput" placeholder="SONG TITLE" oninput="updateFooterTitle(this.value)">
            <div class="header-sub-row">
              <div><input type="text" class="editable-sub" id="artistInput" placeholder="Artist / Band" style="width:160px;"></div>
              <div><input type="text" class="editable-sub" id="styleInput" placeholder="Style: Worship / Pop" style="width:150px; text-align:center;"></div>
              
              <!-- MÉTRICA DEL ENCABEZADO AHORA EDITABLE -->
              <div><span id="lblTimeSigHeader">Time Sig</span>: <input type="text" class="editable-sub displayTimeSig" id="headerTimeSigInput" value="4/4" style="width:50px; text-align:center; font-weight:800;"></div>
              
              <div><input type="text" class="editable-sub" placeholder="BPM: 120" style="width:80px; text-align:right;"></div>
            </div>
          </div>

          <div class="chart-content">
            <div class="section-block">
              <span class="section-badge" contenteditable="true" id="firstSectionBadge">INTRO</span>
              <div class="measures-grid">
                <div class="measure-box" onclick="handleMeasureClick(this, event)">
                  <input type="text" class="chord-input" placeholder="C">
                  <div class="rhythm-slashes"><span>/</span><span>/</span><span>/</span><span>/</span></div>
                </div>
                <div class="measure-box" onclick="handleMeasureClick(this, event)">
                  <input type="text" class="chord-input" placeholder="G/B">
                  <div class="rhythm-slashes"><span>/</span><span>/</span><span>/</span><span>/</span></div>
                </div>
                <div class="measure-box" onclick="handleMeasureClick(this, event)">
                  <input type="text" class="chord-input" placeholder="Am7">
                  <div class="rhythm-slashes"><span>/</span><span>/</span><span>/</span><span>/</span></div>
                </div>
                <div class="measure-box" onclick="handleMeasureClick(this, event)">
                  <input type="text" class="chord-input" placeholder="F2">
                  <div class="rhythm-slashes"><span>/</span><span>/</span><span>/</span><span>/</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="chart-footer">
          <div class="footer-title-ref" id="footerTitle">UNTITLED CHART</div>
          <div class="page-num-ref">PAGE 1 / 1</div>
        </div>
      </div>

    </div>

  </div>

  <script>
    const i18n = {
      en: {
        btnBack: "← HOME",
        titleActions: "⚡ Main Actions",
        btnExportPNG: "📥 Download All (PNG)",
        btnExportPDF: "📄 Download All (PDF)",
        btnAddPage: "📄 Add New Page",
        btnTranspDown: "♭ -1 Semitone",
        btnTranspUp: "♯ +1 Semitone",
        titleTimeSig: "⏱️ Time Signature",
        opt44: "4/4 (Four-Four)",
        opt34: "3/4 (Three-Four)",
        opt24: "2/4 (Two-Four)",
        opt68: "6/8 (Six-Eighths)",
        opt98: "9/8 (Nine-Eighths)",
        opt128: "12/8 (Twelve-Eighths)",
        opt22: "2/2 (Cut Time)",
        btnApplyTimeSig: "⏱️ Apply Time Sig from Selection",
        titleSections: "🏷️ Sections & Song 2",
        btnSubSong2: "➕ Song 2 / Subtitle",
        btnSecEdit: "✏️ EDITABLE",
        btnSecIntro: "+ INTRO",
        btnSecVerse: "+ VERSE",
        btnSecChorus: "+ CHORUS",
        btnSecBridge: "+ BRIDGE",
        btnSecSolo: "+ SOLO",
        secIntro: "INTRO",
        secVerse: "VERSE",
        secChorus: "CHORUS",
        secBridge: "BRIDGE",
        secSolo: "SOLO",
        secNew: "NEW SECTION",
        titleMeasures: "🎼 Measures & Structure",
        btnGroupSelected: "🔗 Group Selected in 1 System",
        btnAdd4: "+ 4 Measures",
        btnAdd8: "+ 8 Measures",
        btnAddN: "+ Custom N",
        lblLocation: "Position relative to selection:",
        btnInsertBefore: "⬅️ Before",
        btnInsertAfter: "➡️ After",
        btnLineBreak: "↵ Line Break (Group)",
        btnDelete: "🗑️ Delete Selected",

    let currentLang = 'en';
    let selectedMeasures = [];
    let lastSelectedMeasure = null;

    function initLanguage() {
      let savedLang = localStorage.getItem('preferred_lang');
      if (!savedLang) {
        const urlParams = new URLSearchParams(window.location.search);
        savedLang = urlParams.get('lang');
      }
      if (!savedLang) {
        const userNavLang = (navigator.language || navigator.userLanguage || '').split('-')[0];
        savedLang = userNavLang;
      }
      if (!i18n[savedLang]) savedLang = 'en';

      currentLang = savedLang;
      document.getElementById('langSelector').value = currentLang;
      applyLanguage(currentLang);
    }

    function applyLanguage(lang) {
      currentLang = lang;
      const dict = i18n[lang] || i18n['en'];

      document.getElementById('btnBack').innerText = dict.btnBack;
      document.getElementById('titleActions').innerText = dict.titleActions;
      document.getElementById('btnExportPNG').innerText = dict.btnExportPNG;
      document.getElementById('btnExportPDF').innerText = dict.btnExportPDF;

    function changeLanguageManually(lang) {
      localStorage.setItem('preferred_lang', lang);
      applyLanguage(lang);
    }

    // --- SELECCIÓN MÚLTIPLE (SHIFT + CLIC) ---
    function handleMeasureClick(el, event) {
      if (el.classList.contains('break-system')) return;

      const allMeasures = Array.from(document.querySelectorAll('.measure-box:not(.break-system)'));

      if (event && event.shiftKey && lastSelectedMeasure) {
        const startIdx = allMeasures.indexOf(lastSelectedMeasure);
        const endIdx = allMeasures.indexOf(el);

        const min = Math.min(startIdx, endIdx);
        const max = Math.max(startIdx, endIdx);

        clearSelections();
        for (let i = min; i <= max; i++) {
          allMeasures[i].classList.add('selected');
          selectedMeasures.push(allMeasures[i]);
        }
      } else {
        clearSelections();
        el.classList.add('selected');
        selectedMeasures = [el];
        lastSelectedMeasure = el;
      }
    }

    function clearSelections() {
      document.querySelectorAll('.measure-box.selected').forEach(m => m.classList.remove('selected'));
      selectedMeasures = [];
    }

    // --- AGRUPAR SELECCIÓN EN 1 SISTEMA ---
    function groupSelectedInSystem() {
      const dict = i18n[currentLang] || i18n['en'];
      if (selectedMeasures.length === 0) {
        alert(dict.alertGroupSelect);
        return;
      }

      const percent = (100 / selectedMeasures.length).toFixed(2);
      selectedMeasures.forEach(m => {
        m.style.flex = `0 0 ${percent}%`;
      });

      const last = selectedMeasures[selectedMeasures.length - 1];
      if (last && last.parentNode) {
        const breakEl = document.createElement('div');
        breakEl.className = 'measure-box break-system';
        last.parentNode.insertBefore(breakEl, last.nextSibling);
      }

      clearSelections();
    }

    function getSlashHTML(timeSig) {
      switch (timeSig) {
        case '4/4':
          return '<span>/</span><span>/</span><span>/</span><span>/</span>';
        case '3/4':
          return '<span>/</span><span>/</span><span>/</span>';
        case '2/4':
        case '2/2':
          return '<span>/</span><span>/</span>';
        case '6/8':
          return '<span>/•</span><span>/•</span>';
        case '9/8':
          return '<span>/•</span><span>/•</span><span>/•</span>';
        case '12/8':
          return '<span>/•</span><span>/•</span><span>/•</span><span>/•</span>';
        default:
          return '<span>/</span><span>/</span><span>/</span><span>/</span>';
      }
    }

    // APLICA LA MÉTRICA DESDE EL COMPÁS SELECCIONADO EN ADELANTE E INSERTA BADGE VISUAL
    function applyTimeSignatureToSelected() {
      const val = document.getElementById('timeSignatureSelect').value;
      if (selectedMeasures.length === 0) {
        const dict = i18n[currentLang] || i18n['en'];
        alert(dict.alertSelectMeasure);
        return;
      }

      const startMeasure = selectedMeasures[0];
      const allMeasures = Array.from(document.querySelectorAll('.measure-box:not(.break-system)'));
      const startIdx = allMeasures.indexOf(startMeasure);

      if (startIdx !== -1) {
        const slashHtml = getSlashHTML(val);
        
        // 1. Si es el primer compás de la obra, actualiza el encabezado general
        if (startIdx === 0) {
          const headerInput = document.getElementById('headerTimeSigInput');
          if (headerInput) headerInput.value = val;
        }

        // 2. Inserta o actualiza el badge con la nueva métrica en el compás inicial del cambio
        let badge = startMeasure.querySelector('.time-sig-badge');
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'time-sig-badge';
          badge.contentEditable = 'true';
          startMeasure.appendChild(badge);
        }
        badge.innerText = val;

        // 3. Modifica los slashes rítmicos desde la selección hacia adelante
        for (let i = startIdx; i < allMeasures.length; i++) {
          const slashes = allMeasures[i].querySelector('.rhythm-slashes');
          if (slashes) {
            slashes.innerHTML = slashHtml;
          }
        }
      }

      if (typeof gtag === 'function') {
        gtag('event', 'change_time_signature_forward', { 'time_sig': val });
      }
    }

    function updateFooterTitle(val) {
      const dict = i18n[currentLang] || i18n['en'];
      const text = val.trim() !== '' ? val.toUpperCase() : dict.untitledChart;
      document.querySelectorAll('.footer-title-ref').forEach(el => el.innerText = text);
      document.querySelectorAll('.subsequent-title-ref').forEach(el => el.innerText = text);
    }

    function addSong2Subtitle() {
      const dict = i18n[currentLang] || i18n['en'];
      const targetMeasure = selectedMeasures.length > 0 ? selectedMeasures[0] : null;

      const sub = document.createElement('div');
      sub.className = 'song2-subtitle';
      sub.contentEditable = 'true';
      sub.innerText = dict.song2Placeholder;

      if (targetMeasure && targetMeasure.parentNode) {
        const block = targetMeasure.closest('.section-block');
        if (block) {
          block.parentNode.insertBefore(sub, block);
        }
      } else {
        const content = getCurrentPageContent();
        content.appendChild(sub);
      }
    }

    function addNewPageManual() {
      const pages = document.querySelectorAll('.chart-paper');
      const newPage = createNewPageElement(pages.length + 1);
      document.getElementById('sheetsContainer').appendChild(newPage);
      
      const dict = i18n[currentLang] || i18n['en'];
      const content = newPage.querySelector('.chart-content');
      
      const newBlock = document.createElement('div');
      newBlock.className = 'section-block';
      const grid = document.createElement('div');
      grid.className = 'measures-grid';
      for (let i = 0; i < 4; i++) {
        grid.appendChild(createMeasureElement());
      }
      newBlock.innerHTML = `<span class="section-badge" contenteditable="true">${dict.secNew}</span>`;
      newBlock.appendChild(grid);
      content.appendChild(newBlock);

      updateTotalPagesCounter();
    }

    function getCurrentPageContent() {
      const pages = document.querySelectorAll('.chart-paper');
      const lastPage = pages[pages.length - 1];
      return lastPage.querySelector('.chart-content');
    }

    function cleanupEmptyPages() {
      const pages = Array.from(document.querySelectorAll('.chart-paper'));
      for (let i = pages.length - 1; i > 0; i--) {
        let page = pages[i];
        let measures = page.querySelectorAll('.measure-box:not(.break-system)');
        if (measures.length === 0) {
          page.parentNode.removeChild(page);
        } else {
          break; 
        }
      }
      updateTotalPagesCounter();
    }

    function createNewPageElement(pageNum) {
      const dict = i18n[currentLang] || i18n['en'];
      const titleText = document.getElementById('songTitleInput').value.toUpperCase() || dict.untitledChart;

      const newPaper = document.createElement('div');
      newPaper.className = 'chart-paper';
      newPaper.id = `paper-page-${pageNum}`;

      newPaper.innerHTML = `
        <div class="paper-inner">
          <div class="chart-header-subsequent">
            <span class="subsequent-title-ref">${titleText}</span>
            <span>(CONT.)</span>
          </div>
          <div class="chart-content"></div>
        </div>
        <div class="chart-footer">
          <div class="footer-title-ref">${titleText}</div>
          <div class="page-num-ref">${dict.pageLabel} ${pageNum} / ${pageNum}</div>
        </div>
      `;
      return newPaper;
    }

    function updateTotalPagesCounter() {
      const dict = i18n[currentLang] || i18n['en'];
      const total = document.querySelectorAll('.chart-paper').length;
      document.querySelectorAll('.page-num-ref').forEach((el, idx) => {
        el.innerText = `${dict.pageLabel} ${idx + 1} / ${total}`;
      });
    }

    function addEditableSection() {
      const dict = i18n[currentLang] || i18n['en'];
      addSection(dict.secNew, true);
    }

    function createMeasureElement() {
      const dict = i18n[currentLang] || i18n['en'];
      const timeSig = document.getElementById('timeSignatureSelect').value;
      const box = document.createElement('div');
      box.className = 'measure-box';
      box.onclick = function(e) { handleMeasureClick(this, e); };
      box.innerHTML = `
        <input type="text" class="chord-input" placeholder="${dict.chordPlaceholder}">
        <div class="rhythm-slashes">${getSlashHTML(timeSig)}</div>
      `;
      return box;
    }

    function addSection(title, isEditable = false) {
      const content = getCurrentPageContent();
      const newBlock = document.createElement('div');
      newBlock.className = 'section-block';

      const grid = document.createElement('div');
      grid.className = 'measures-grid';
      for (let i = 0; i < 4; i++) {
        grid.appendChild(createMeasureElement());
      }

      newBlock.innerHTML = `<span class="section-badge" contenteditable="true">${title}</span>`;
      newBlock.appendChild(grid);
      content.appendChild(newBlock);
    }

    function addMultipleMeasures(qty) {
      const count = qty || parseInt(document.getElementById('customMeasureQty').value) || 1;
      const content = getCurrentPageContent();
      let targetGrid;

      const blocks = content.querySelectorAll('.section-block');
      if (blocks.length > 0) {
        targetGrid = blocks[blocks.length - 1].querySelector('.measures-grid');
      } else {
        const dict = i18n[currentLang] || i18n['en'];
        addSection(dict.secNew);
        const newBlocks = content.querySelectorAll('.section-block');
        targetGrid = newBlocks[newBlocks.length - 1].querySelector('.measures-grid');
      }

      for (let i = 0; i < count; i++) {
        targetGrid.appendChild(createMeasureElement());
      }
    }

    function insertMeasure(position) {
      const dict = i18n[currentLang] || i18n['en'];
      if (selectedMeasures.length === 0) {
        alert(dict.alertSelectMeasure);
        return;
      }

      const target = selectedMeasures[0];
      const newBox = createMeasureElement();
      if (position === 'before') {
        target.parentNode.insertBefore(newBox, target);
      } else {
        target.parentNode.insertBefore(newBox, target.nextSibling);
      }

      handleMeasureClick(newBox, null);
    }

    function toggleSystemBreak() {
      const dict = i18n[currentLang] || i18n['en'];
      if (selectedMeasures.length === 0) {
        alert(dict.alertSelectBreak);
        return;
      }
      const target = selectedMeasures[selectedMeasures.length - 1];
      const grid = target.parentNode;
      const breakEl = document.createElement('div');
      breakEl.className = 'measure-box break-system';
      grid.insertBefore(breakEl, target.nextSibling);
    }

    function removeSelectedMeasure() {
      if (selectedMeasures.length > 0) {
        selectedMeasures.forEach(m => {
          if (m && m.parentNode) {
            m.parentNode.removeChild(m);
          }
        });
        clearSelections();
        lastSelectedMeasure = null;
        cleanupEmptyPages();
      }
    }

    function addAnnotation(text, isEditable = false) {
      const dict = i18n[currentLang] || i18n['en'];
      if (selectedMeasures.length === 0) {
        alert(dict.alertSelectNote);
        return;
      }
      const target = selectedMeasures[0];
      let badge = target.querySelector('.band-annotation');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'band-annotation';
        badge.contentEditable = 'true';
        target.appendChild(badge);
      }
      badge.innerText = text;
    }

    const notesChromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const notesFlats = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

    function transposeChord(chord, semitones) {
      return chord.replace(/[A-G][#b]?/g, (match) => {
        let index = notesChromatic.indexOf(match);
        if (index === -1) index = notesFlats.indexOf(match);
        if (index === -1) return match;
        let newIndex = (index + semitones + 12) % 12;
        return notesChromatic[newIndex];
      });
    }

    function transposeAll(semitones) {
      document.querySelectorAll('.chord-input').forEach(input => {
        if (input.value.trim() !== '') {
          input.value = transposeChord(input.value, semitones);
        }
      });

      if (typeof gtag === 'function') {
        gtag('event', 'transpose_chart', { 'semitones': semitones });
      }
    }

    const RENDER_OPTIONS = {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      scrollX: 0,
      scrollY: 0,
      width: 794,
      height: 1123,
      windowWidth: 1200
    };

    function exportAllPagesToPNG() {
      if (typeof gtag === 'function') {
        gtag('event', 'export_chart_png', {
          'song_title': document.getElementById('songTitleInput').value || 'Sin Titulo',
          'total_pages': document.querySelectorAll('.chart-paper').length
        });
      }

      clearSelections();

      document.fonts.ready.then(() => {
        const papers = document.querySelectorAll('.chart-paper');
        papers.forEach((paper, idx) => {
          html2canvas(paper, RENDER_OPTIONS).then(canvas => {
            const link = document.createElement('a');
            const title = document.getElementById('songTitleInput').value || 'chart';
            link.download = `${title.toLowerCase().replace(/\s+/g, '-')}-page-${idx + 1}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        });
      });
    }

    function exportAllPagesToPDF() {
      if (typeof gtag === 'function') {
        gtag('event', 'export_chart_pdf', {
          'song_title': document.getElementById('songTitleInput').value || 'Sin Titulo',
          'total_pages': document.querySelectorAll('.chart-paper').length
        });
      }

      clearSelections();

      document.fonts.ready.then(() => {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const papers = Array.from(document.querySelectorAll('.chart-paper'));
        const title = document.getElementById('songTitleInput').value || 'chart';

        let processed = 0;

        papers.forEach((paper, idx) => {
          html2canvas(paper, RENDER_OPTIONS).then(canvas => {
            const imgData = canvas.toDataURL('image/jpeg', 0.98);
            if (idx > 0) pdf.addPage();
            
            pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
            
            processed++;
            if (processed === papers.length) {
              pdf.save(`${title.toLowerCase().replace(/\s+/g, '-')}.pdf`);
            }
          });
        });
      });
    }

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedMeasures.length > 0) {
        const isEditingInput = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.isContentEditable);
        if (!isEditingInput) {
          e.preventDefault();
          removeSelectedMeasure();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      initLanguage();
    });
  </script>
