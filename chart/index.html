<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Chart Studio</title>
  
  <!-- Tipografía Bungee exacta para el título e Inter para el cuerpo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- html2canvas para la exportación limpia a PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-dark: #090c15;
      --panel-bg: rgba(18, 22, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-purple: #a855f7;
      --accent-cyan: #06b6d4;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --paper-bg: #ffffff;
      --paper-text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BARRA SUPERIOR DE NAVEGACIÓN FUERA DEL MÓDULO */
    .top-nav {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 15px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-back:hover {
      color: #fff;
      border-color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.2);
      transform: translateX(-3px);
    }

    /* LAYOUT PRINCIPAL: PANEL DE HERRAMIENTAS + HOJA PREVIEW */
    .studio-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* PANEL DE CONTROL LATERAL */
    .toolbox-panel {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .toolbox-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolbox-title {
      font-size: 0.8em;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-light);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tool-btn:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: var(--accent-purple);
      color: #fff;
    }

    .tool-btn.primary {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      color: #fff;
      font-weight: 700;
    }

    .tool-btn.primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .select-input, .text-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85em;
      outline: none;
    }

    /* CONTENEDOR DE LA HOJA (CHART HOJA BLANCA IMPRESA) */
    .sheet-wrapper {
      background: #e2e8f0;
      padding: 30px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    /* DISEÑO CARACTERÍSTICO CON ENCUADRE MODERNO Y MARCAS DE ESQUINA */
    .chart-paper {
      width: 794px; /* Formato A4 proporcional */
      min-height: 1123px;
      background: var(--paper-bg);
      color: var(--paper-text);
      padding: 45px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border-radius: 14px;
      border: 2px solid #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* MARCAS DE ENCUADRE ESTÉTICAS EN LAS ESQUINAS (SIGNATURE FRAME) */
    .chart-paper::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px dashed rgba(15, 23, 42, 0.25);
      border-radius: 8px;
      pointer-events: none;
    }

    .paper-inner {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
    }

    /* ENCABEZADO EDITABLE CON TIPOGRAFÍA BUNGEE */
    .chart-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 15px;
    }

    .song-title-editable {
      font-family: 'Bungee', cursive, sans-serif;
      font-size: 2.1em;
      text-transform: uppercase;
      text-align: center;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      background: transparent;
      letter-spacing: 1px;
    }

    .song-title-editable::placeholder {
      color: #cbd5e1;
    }

    .header-sub-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9em;
      font-weight: 600;
      color: #475569;
    }

    .editable-sub {
      border: none;
      outline: none;
      background: transparent;
      color: #334155;
      font-weight: 600;
      font-size: 1em;
    }

    .editable-sub::placeholder {
      color: #cbd5e1;
    }

    /* GRILLA DE COMPASES Y SECCIONES */
    .chart-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-badge {
      display: inline-block;
      align-self: flex-start;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
      font-size: 0.85em;
      padding: 4px 12px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .measures-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border-left: 2px solid #0f172a;
    }

    .measure-box {
      height: 75px;
      border-right: 2px solid #0f172a;
      border-top: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: #fff;
    }

    .measure-box:nth-child(-n+4) {
      border-top: 2px solid #0f172a;
    }
    
    .measure-box:nth-last-child(-n+4) {
      border-bottom: 2px solid #0f172a;
    }

    .chord-input {
      font-size: 1.15em;
      font-weight: 800;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      background: transparent;
    }

    .rhythm-slashes {
      display: flex;
      justify-content: space-around;
      color: #94a3b8;
      font-size: 1.2em;
      user-select: none;
      font-weight: 700;
    }

    .band-annotation {
      position: absolute;
      top: -12px;
      right: 8px;
      font-size: 0.7em;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #bfdbfe;
    }

    /* PIE DE PÁGINA (PAGINACIÓN Y REFERENCIA DE CANCIÓN) */
    .chart-footer {
      border-top: 1.5px dashed #cbd5e1;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8em;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .footer-title-ref {
      text-transform: uppercase;
      color: #334155;
    }

    @media (max-width: 950px) {
      .studio-layout { grid-template-columns: 1fr; }
      .sheet-wrapper { padding: 10px; }
      .chart-paper { width: 100%; min-height: auto; padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN SUPERIOR -->
  <div class="top-nav">
    <a href="../index.html" class="btn-back">← INICIO</a>
  </div>

  <div class="studio-layout">
    
    <!-- PANEL LATERAL DE CONTROL -->
    <div class="toolbox-panel">
      
      <!-- EXPORTAR & TRANSPOSICIÓN -->
      <div class="toolbox-section">
        <div class="toolbox-title">⚡ Acciones Principales</div>
        <button class="tool-btn primary" onclick="exportToPNG()">📥 Descargar Chart (PNG)</button>
        
        <div style="display:flex; gap:8px; margin-top:5px;">
          <button class="tool-btn" style="flex:1;" onclick="transposeAll(-1)">♭ -1 Semitono</button>
          <button class="tool-btn" style="flex:1;" onclick="transposeAll(1)">♯ +1 Semitono</button>
        </div>
      </div>

      <!-- MÉTRICA DE TIEMPO -->
      <div class="toolbox-section">
        <div class="toolbox-title">⏱️ Métrica de Tiempo</div>
        <select class="select-input" id="timeSignatureSelect" onchange="updateTimeSignature(this.value)">
          <option value="4/4" selected>4/4 (Cuatro por Cuatro)</option>
          <option value="3/4">3/4 (Tres por Cuatro)</option>
          <option value="2/4">2/4 (Dos por Cuatro)</option>
          <option value="6/8">6/8 (Seis por Ocho)</option>
          <option value="9/8">9/8 (Nueve por Ocho)</option>
          <option value="12/8">12/8 (Doce por Ocho)</option>
          <option value="2/2">2/2 (Dos por Dos)</option>
        </select>
      </div>

      <!-- AGREGAR SECCIONES EXPANSIÓN -->
      <div class="toolbox-section">
        <div class="toolbox-title">🏷️ Agregar Secciones</div>
        <div class="btn-grid">
          <button class="tool-btn" onclick="addSection('INTRO')">+ INTRO</button>
          <button class="tool-btn" onclick="addSection('REINTRO')">+ REINTRO</button>
          <button class="tool-btn" onclick="addSection('VERSO')">+ VERSO</button>
          <button class="tool-btn" onclick="addSection('PRE-CORO')">+ PRE-CORO</button>
          <button class="tool-btn" onclick="addSection('CORO')">+ CORO</button>
          <button class="tool-btn" onclick="addSection('PUENTE')">+ PUENTE</button>
          <button class="tool-btn" onclick="addSection('INSTRUMENTAL')">+ INSTRUM.</button>
          <button class="tool-btn" onclick="addSection('SOLO')">+ SOLO</button>
          <button class="tool-btn" onclick="addSection('SOLO GUITARRA')">+ SOLO GT</button>
          <button class="tool-btn" onclick="addSection('SOLO PIANO')">+ SOLO PNO</button>
          <button class="tool-btn" onclick="addSection('SOLO BATERÍA')">+ SOLO BAT</button>
          <button class="tool-btn" onclick="addSection('SOLO BAJO')">+ SOLO BAJO</button>
          <button class="tool-btn" onclick="addSection('SOLO VOCES')">+ SOLO VOCES</button>
          <button class="tool-btn" onclick="addSection('OUTRO')">+ OUTRO</button>
        </div>
      </div>

      <!-- ESTRUCTURA DE COMPASES -->
      <div class="toolbox-section">
        <div class="toolbox-title">🎼 Compases</div>
        <button class="tool-btn" onclick="addMeasureSystem()">+ Agregar Sistema (4 Compases)</button>
        <button class="tool-btn" onclick="addSingleMeasure()">+ Agregar 1 Compás</button>
        <button class="tool-btn" style="color:#fca5a5; border-color:rgba(239,68,68,0.3);" onclick="removeLastMeasure()">🗑️ Eliminar Último Compás</button>
      </div>

      <!-- ANOTACIONES BANDA -->
      <div class="toolbox-section">
        <div class="toolbox-title">📌 Indicaciones Banda</div>
        <div class="btn-grid">
          <button class="tool-btn" onclick="addAnnotation('Banda IN')">Banda IN</button>
          <button class="tool-btn" onclick="addAnnotation('Tutti')">Tutti</button>
          <button class="tool-btn" onclick="addAnnotation('Corte')">Corte</button>
          <button class="tool-btn" onclick="addAnnotation('Loop')">Loop</button>
          <button class="tool-btn" onclick="addAnnotation('Pad Only')">Pad Only</button>
          <button class="tool-btn" onclick="addAnnotation('Solo Bat')">Solo Bat</button>
        </div>
      </div>

    </div>

    <!-- ÁREA DE HOJA BLANCA IMPRESA -->
    <div class="sheet-wrapper">
      <div class="chart-paper" id="chartPaper">
        
        <div class="paper-inner">
          <!-- ENCABEZADO EDITABLE CON TIPOGRAFÍA BUNGEE -->
          <div class="chart-header">
            <input type="text" class="song-title-editable" id="songTitleInput" placeholder="TÍTULO DE LA CANCIÓN" value="" oninput="updateFooterTitle(this.value)">
            
            <div class="header-sub-row">
              <div><input type="text" class="editable-sub" placeholder="Artista / Banda" style="width:200px;"></div>
              <div>Métrica: <span id="displayTimeSig">4/4</span></div>
              <div><input type="text" class="editable-sub" placeholder="BPM: 120" style="width:90px; text-align:right;"></div>
            </div>
          </div>

          <!-- ESTRUCTURA DE COMPASES DE LA CANCIÓN -->
          <div class="chart-content" id="chartContent">
            
            <!-- SECCIÓN DE INICIO POR DEFECTO -->
            <div class="section-block">
              <span class="section-badge">INTRO</span>
              <div class="measures-grid" id="grid-1">
                <div class="measure-box">
                  <input type="text" class="chord-input" placeholder="C">
                  <div class="rhythm-slashes">///////</div>
                </div>
                <div class="measure-box">
                  <input type="text" class="chord-input" placeholder="G/B">
                  <div class="rhythm-slashes">///////</div>
                </div>
                <div class="measure-box">
                  <input type="text" class="chord-input" placeholder="Am7">
                  <div class="rhythm-slashes">///////</div>
                </div>
                <div class="measure-box">
                  <input type="text" class="chord-input" placeholder="F2">
                  <div class="rhythm-slashes">///////</div>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- PIE DE PÁGINA CON REFERENCIA AUTOMÁTICA DE CANCIÓN Y PAGINACIÓN -->
        <div class="chart-footer">
          <div class="footer-title-ref" id="footerTitleRef">UNTITLED CHART</div>
          <div>PÁG. <span id="currentPageNum">1</span> / <span id="totalPagesNum">1</span></div>
        </div>

      </div>
    </div>

  </div>

  <script>
    let activeGridId = 'grid-1';
    let gridCounter = 1;

    function updateTimeSignature(val) {
      document.getElementById('displayTimeSig').innerText = val;
    }

    function updateFooterTitle(val) {
      const ref = document.getElementById('footerTitleRef');
      ref.innerText = val.trim() !== '' ? val.toUpperCase() : 'UNTITLED CHART';
    }

    function addSection(title) {
      gridCounter++;
      const content = document.getElementById('chartContent');
      
      const newBlock = document.createElement('div');
      newBlock.className = 'section-block';
      
      const newGridId = `grid-${gridCounter}`;
      activeGridId = newGridId;

      newBlock.innerHTML = `
        <span class="section-badge">${title}</span>
        <div class="measures-grid" id="${newGridId}">
          <div class="measure-box">
            <input type="text" class="chord-input" placeholder="Acorde">
            <div class="rhythm-slashes">///////</div>
          </div>
          <div class="measure-box">
            <input type="text" class="chord-input" placeholder="Acorde">
            <div class="rhythm-slashes">///////</div>
          </div>
          <div class="measure-box">
            <input type="text" class="chord-input" placeholder="Acorde">
            <div class="rhythm-slashes">///////</div>
          </div>
          <div class="measure-box">
            <input type="text" class="chord-input" placeholder="Acorde">
            <div class="rhythm-slashes">///////</div>
          </div>
        </div>
      `;
      content.appendChild(newBlock);
    }

    function addMeasureSystem() {
      const activeGrid = document.getElementById(activeGridId) || document.querySelector('.measures-grid');
      for (let i = 0; i < 4; i++) {
        const box = document.createElement('div');
        box.className = 'measure-box';
        box.innerHTML = `
          <input type="text" class="chord-input" placeholder="Acorde">
          <div class="rhythm-slashes">///////</div>
        `;
        activeGrid.appendChild(box);
      }
    }

    function addSingleMeasure() {
      const activeGrid = document.getElementById(activeGridId) || document.querySelector('.measures-grid');
      const box = document.createElement('div');
      box.className = 'measure-box';
      box.innerHTML = `
        <input type="text" class="chord-input" placeholder="Acorde">
        <div class="rhythm-slashes">///////</div>
      `;
      activeGrid.appendChild(box);
    }

    function removeLastMeasure() {
      const activeGrid = document.getElementById(activeGridId) || document.querySelector('.measures-grid');
      if (activeGrid && activeGrid.lastElementChild) {
        activeGrid.removeChild(activeGrid.lastElementChild);
      }
    }

    function addAnnotation(text) {
      const activeGrid = document.getElementById(activeGridId) || document.querySelector('.measures-grid');
      if (activeGrid && activeGrid.lastElementChild) {
        const lastBox = activeGrid.lastElementChild;
        let badge = lastBox.querySelector('.band-annotation');
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'band-annotation';
          lastBox.appendChild(badge);
        }
        badge.innerText = text;
      }
    }

    // MOTOR DE TRANSPOSICIÓN AUTOMÁTICA DE ACORDES
    const notesChromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const notesFlats = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

    function transposeChord(chord, semitones) {
      return chord.replace(/[A-G][#b]?/g, (match) => {
        let index = notesChromatic.indexOf(match);
        if (index === -1) index = notesFlats.indexOf(match);
        if (index === -1) return match;
        let newIndex = (index + semitones + 12) % 12;
        return notesChromatic[newIndex];
      });
    }

    function transposeAll(semitones) {
      const inputs = document.querySelectorAll('.chord-input');
      inputs.forEach(input => {
        if (input.value.trim() !== '') {
          input.value = transposeChord(input.value, semitones);
        }
      });
    }

    // EXPORTACIÓN A PNG ALTA CALIDAD
    function exportToPNG() {
      const paper = document.getElementById('chartPaper');
      html2canvas(paper, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'chart-partitura.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
