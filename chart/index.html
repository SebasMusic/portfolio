<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Chart Studio</title>
  
  <!-- Tipografía Bungee exacta para el título e Inter para el cuerpo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- html2canvas para exportar a PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-dark: #090c15;
      --panel-bg: rgba(18, 22, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-purple: #a855f7;
      --accent-cyan: #06b6d4;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --paper-bg: #ffffff;
      --paper-text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* BARRA SUPERIOR CON SELECTOR DE IDIOMA */
    .top-nav {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-back:hover {
      color: #fff;
      border-color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.2);
      transform: translateX(-3px);
    }

    .lang-selector-mini {
      background: rgba(18, 22, 38, 0.85);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8em;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* LAYOUT STUDIO */
    .studio-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* PANEL LATERAL DE CONTROL */
    .toolbox-panel {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .toolbox-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toolbox-title {
      font-size: 0.8em;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-light);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tool-btn:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: var(--accent-purple);
      color: #fff;
    }

    .tool-btn.primary {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border: none;
      color: #fff;
      font-weight: 700;
    }

    .tool-btn.primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .tool-btn.custom-btn {
      border: 1px dashed var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .select-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85em;
      outline: none;
    }

    /* CONTENEDOR MULTI-HOJA A4 */
    .sheets-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      background: #e2e8f0;
      padding: 30px;
      border-radius: 20px;
      align-items: center;
    }

    .chart-paper {
      width: 794px;
      height: 1123px; /* Tamaño A4 estricto */
      background: var(--paper-bg);
      color: var(--paper-text);
      padding: 45px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border-radius: 14px;
      border: 2px solid #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .chart-paper::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px dashed rgba(15, 23, 42, 0.25);
      border-radius: 8px;
      pointer-events: none;
    }

    .paper-inner {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    .chart-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
    }

    .song-title-editable {
      font-family: 'Bungee', cursive, sans-serif;
      font-size: 2em;
      text-transform: uppercase;
      text-align: center;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      background: transparent;
      letter-spacing: 1px;
    }

    .song-title-editable::placeholder { color: #cbd5e1; }

    .header-sub-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88em;
      font-weight: 600;
      color: #475569;
    }

    .editable-sub {
      border: none;
      outline: none;
      background: transparent;
      color: #334155;
      font-weight: 600;
      font-size: 1em;
    }

    .editable-sub::placeholder { color: #cbd5e1; }

    .chart-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-badge {
      display: inline-block;
      align-self: flex-start;
      background: #0f172a;
      color: #fff;
      font-weight: 800;
      font-size: 0.85em;
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
      border: none;
      outline: none;
      text-transform: uppercase;
    }

    .measures-grid {
      display: flex;
      flex-wrap: wrap;
      border-left: 2px solid #0f172a;
    }

    .measure-box {
      height: 72px;
      border-right: 2px solid #0f172a;
      border-top: 2px solid #0f172a;
      border-bottom: 2px solid #0f172a;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: #fff;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .measure-box.selected {
      background: #f0fdf4;
      border-color: #16a34a !important;
    }

    .measure-box.break-system {
      flex-basis: 100% !important;
      height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
    }

    .chord-input {
      font-size: 1.15em;
      font-weight: 800;
      border: none;
      outline: none;
      width: 100%;
      color: #0f172a;
      background: transparent;
    }

    /* SLASHES DE DURACIÓN SEGÚN MÉTRICA */
    .rhythm-slashes {
      display: flex;
      justify-content: space-around;
      align-items: center;
      color: #64748b;
      font-size: 1.15em;
      user-select: none;
      font-weight: 800;
      width: 100%;
    }

    .rhythm-slashes span {
      display: inline-block;
      letter-spacing: -1px;
    }

    .band-annotation {
      position: absolute;
      top: -10px;
      right: 6px;
      font-size: 0.7em;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #bfdbfe;
      outline: none;
    }

    .chart-footer {
      border-top: 1.5px dashed #cbd5e1;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8em;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    .footer-title-ref {
      text-transform: uppercase;
      color: #334155;
    }

    @media (max-width: 950px) {
      .studio-layout { grid-template-columns: 1fr; }
      .sheets-container { padding: 10px; }
      .chart-paper { width: 100%; height: auto; min-height: 1123px; }
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN SUPERIOR CON BOTÓN E IDIOMA -->
  <div class="top-nav">
    <a href="../index.html" class="btn-back" id="btnBack">← HOME</a>
    
    <select class="lang-selector-mini" id="langSelector" onchange="changeLanguageManually(this.value)">
      <option value="en">🇬🇧 English</option>
      <option value="es">🇪🇸 Español</option>
      <option value="pt">🇧🇷 Português</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="ja">🇯🇵 日本語</option>
    </select>
  </div>

  <div class="studio-layout">
    
    <!-- PANEL LATERAL DE CONTROL -->
    <div class="toolbox-panel">
      
      <!-- EXPORTAR & TRANSPOSICIÓN -->
      <div class="toolbox-section">
        <div class="toolbox-title" id="titleActions">⚡ Main Actions</div>
        <button class="tool-btn primary" id="btnExportPNG" onclick="exportAllPagesToPNG()">📥 Download All (PNG)</button>
        
        <div style="display:flex; gap:8px; margin-top:5px;">
          <button class="tool-btn" style="flex:1;" id="btnTranspDown" onclick="transposeAll(-1)">♭ -1 Semitone</button>
          <button class="tool-btn" style="flex:1;" id="btnTranspUp" onclick="transposeAll(1)">♯ +1 Semitone</button>
        </div>
      </div>

      <!-- MÉTRICA DE TIEMPO -->
      <div class="toolbox-section">
        <div class="toolbox-title" id="titleTimeSig">⏱️ Time Signature</div>
        <select class="select-input" id="timeSignatureSelect" onchange="updateTimeSignature(this.value)">
          <option value="4/4" selected id="opt44">4/4 (Four-Four)</option>
          <option value="3/4" id="opt34">3/4 (Three-Four)</option>
          <option value="2/4" id="opt24">2/4 (Two-Four)</option>
          <option value="6/8" id="opt68">6/8 (Six-Eighths)</option>
          <option value="9/8" id="opt98">9/8 (Nine-Eighths)</option>
          <option value="12/8" id="opt128">12/8 (Twelve-Eighths)</option>
          <option value="2/2" id="opt22">2/2 (Cut Time)</option>
        </select>
      </div>

      <!-- SECCIONES -->
      <div class="toolbox-section">
        <div class="toolbox-title" id="titleSections">🏷️ Sections</div>
        <div class="btn-grid">
          <button class="tool-btn custom-btn" id="btnSecEdit" onclick="addEditableSection()">✏️ EDITABLE</button>
          <button class="tool-btn" id="btnSecIntro" onclick="addSection(i18n[currentLang].secIntro)">+ INTRO</button>
          <button class="tool-btn" id="btnSecVerse" onclick="addSection(i18n[currentLang].secVerse)">+ VERSE</button>
          <button class="tool-btn" id="btnSecChorus" onclick="addSection(i18n[currentLang].secChorus)">+ CHORUS</button>
          <button class="tool-btn" id="btnSecBridge" onclick="addSection(i18n[currentLang].secBridge)">+ BRIDGE</button>
          <button class="tool-btn" id="btnSecSolo" onclick="addSection(i18n[currentLang].secSolo)">+ SOLO</button>
        </div>
      </div>

      <!-- INSERCIÓN Y AGRUPACIÓN DE COMPASES EXPANDIDA -->
      <div class="toolbox-section">
        <div class="toolbox-title" id="titleMeasures">🎼 Measures & Structure</div>
        <div class="btn-grid">
          <button class="tool-btn" id="btnAdd4" onclick="addMultipleMeasures(4)">+ 4 Measures</button>
          <button class="tool-btn" id="btnAdd8" onclick="addMultipleMeasures(8)">+ 8 Measures</button>
        </div>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input type="number" id="customMeasureQty" value="12" min="1" max="100" class="select-input" style="width:70px; text-align:center;">
          <button class="tool-btn" style="flex:1;" id="btnAddN" onclick="addMultipleMeasures()">+ Custom N</button>
        </div>
        <div style="font-size:0.75em; color:var(--text-muted); margin-top:6px; margin-bottom:2px;" id="lblLocation">Position relative to selection:</div>
        <div class="btn-grid">
          <button class="tool-btn" id="btnInsertBefore" onclick="insertMeasure('before')">⬅️ Before</button>
          <button class="tool-btn" id="btnInsertAfter" onclick="insertMeasure('after')">➡️ After</button>
        </div>
        <button class="tool-btn" style="margin-top:6px; background:rgba(234,179,8,0.15); border-color:rgba(234,179,8,0.4); color:#fef08a;" id="btnLineBreak" onclick="toggleSystemBreak()">↵ Line Break (Group)</button>
        <button class="tool-btn" style="margin-top:4px; color:#fca5a5; border-color:rgba(239,68,68,0.3);" id="btnDelete" onclick="removeSelectedMeasure()">🗑️ Delete Selected</button>
      </div>

      <!-- INDICACIONES BANDA -->
      <div class="toolbox-section">
        <div class="toolbox-title" id="titleAnnotations">📌 Band Cues</div>
        <button class="tool-btn custom-btn" id="btnCustomNote" onclick="addAnnotation(i18n[currentLang].noteDefault, true)">✏️ Custom Note</button>
        <div class="btn-grid" style="margin-top:6px;">
          <button class="tool-btn" id="btnBandIn" onclick="addAnnotation(i18n[currentLang].bandIn)">Band IN</button>
          <button class="tool-btn" id="btnTutti" onclick="addAnnotation('Tutti')">Tutti</button>

          <button class="tool-btn" id="btnCorte" onclick="addAnnotation(i18n[currentLang].corte)">Break / Cut</button>
          <button class="tool-btn" id="btnPadOnly" onclick="addAnnotation('Pad Only')">Pad Only</button>
        </div>
      </div>

    </div>

    <!-- CONTENEDOR MULTI-PÁGINA A4 -->
    <div class="sheets-container" id="sheetsContainer">
      
      <!-- PÁGINA 1 -->
      <div class="chart-paper" id="paper-page-1">
        <div class="paper-inner">
          <div class="chart-header">
            <input type="text" class="song-title-editable" id="songTitleInput" placeholder="SONG TITLE" oninput="updateFooterTitle(this.value)">
            <div class="header-sub-row">
              <div><input type="text" class="editable-sub" id="artistInput" placeholder="Artist / Band" style="width:200px;"></div>
              <div><span id="lblTimeSigHeader">Time Sig</span>: <span class="displayTimeSig">4/4</span></div>
              <div><input type="text" class="editable-sub" placeholder="BPM: 120" style="width:90px; text-align:right;"></div>
            </div>
          </div>

          <div class="chart-content">
            <div class="section-block">
              <span class="section-badge" contenteditable="true" id="firstSectionBadge">INTRO</span>
              <div class="measures-grid">
                <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
                  <input type="text" class="chord-input" placeholder="C">
                  <div class="rhythm-slashes"><span>/</span><span>/</span><span>/</span><span>/</span></div>
                </div>
                <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
                  <input type="text" class="chord-input" placeholder="G/B">
                  <div class="rhythm-slashes"><span>/</span><span>/</span><span>/</span><span>/</span></div>
                </div>
                <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
                  <input type="text" class="chord-input" placeholder="Am7">
                  <div class="rhythm-slashes"><span>/</span><span>/</span><span>/</span><span>/</span></div>
                </div>
                <div class="measure-box" style="flex: 0 0 25%;" onclick="selectMeasure(this)">
                  <input type="text" class="chord-input" placeholder="F2">
                  <div class="rhythm-slashes"><span>/</span><span>/</span><span>/</span><span>/</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="chart-footer">
          <div class="footer-title-ref" id="footerTitle">UNTITLED CHART</div>
          <div class="page-num-ref">PAGE 1 / 1</div>
        </div>
      </div>

    </div>

  </div>

    let currentLang = 'en';
    let selectedMeasure = null;
    let pageCount = 1;

    // DETECCIÓN E INICIALIZACIÓN SINCRO CON INDEX.HTML
    function initLanguage() {
      // Usa exactamente la clave 'preferred_lang' del archivo principal
      let savedLang = localStorage.getItem('preferred_lang');

      // Fallback a URL o lenguaje del navegador
      if (!savedLang) {
        const urlParams = new URLSearchParams(window.location.search);
        savedLang = urlParams.get('lang');
      }

      if (!savedLang) {
        const userNavLang = (navigator.language || navigator.userLanguage || '').split('-')[0];
        savedLang = userNavLang;
      }

      if (!i18n[savedLang]) {
        savedLang = 'en';
      }

      currentLang = savedLang;
      document.getElementById('langSelector').value = currentLang;
      applyLanguage(currentLang);
    }

    function applyLanguage(lang) {
      currentLang = lang;
      const dict = i18n[lang] || i18n['en'];

      // Botones e Interfaz General
      document.getElementById('btnBack').innerText = dict.btnBack;
      document.getElementById('titleActions').innerText = dict.titleActions;
      document.getElementById('btnExportPNG').innerText = dict.btnExportPNG;
      document.getElementById('btnTranspDown').innerText = dict.btnTranspDown;
      document.getElementById('btnTranspUp').innerText = dict.btnTranspUp;

      document.getElementById('titleTimeSig').innerText = dict.titleTimeSig;
      document.getElementById('opt44').innerText = dict.opt44;
      document.getElementById('opt34').innerText = dict.opt34;
      document.getElementById('opt24').innerText = dict.opt24;
      document.getElementById('opt68').innerText = dict.opt68;
      document.getElementById('opt98').innerText = dict.opt98;
      document.getElementById('opt128').innerText = dict.opt128;
      document.getElementById('opt22').innerText = dict.opt22;

      document.getElementById('titleSections').innerText = dict.titleSections;
      document.getElementById('btnSecEdit').innerText = dict.btnSecEdit;
      document.getElementById('btnSecIntro').innerText = dict.btnSecIntro;
      document.getElementById('btnSecVerse').innerText = dict.btnSecVerse;
      document.getElementById('btnSecChorus').innerText = dict.btnSecChorus;
      document.getElementById('btnSecBridge').innerText = dict.btnSecBridge;
      document.getElementById('btnSecSolo').innerText = dict.btnSecSolo;

      document.getElementById('titleMeasures').innerText = dict.titleMeasures;
      document.getElementById('btnAdd4').innerText = dict.btnAdd4;
      document.getElementById('btnAdd8').innerText = dict.btnAdd8;
      document.getElementById('btnAddN').innerText = dict.btnAddN;
      document.getElementById('lblLocation').innerText = dict.lblLocation;
      document.getElementById('btnInsertBefore').innerText = dict.btnInsertBefore;
      document.getElementById('btnInsertAfter').innerText = dict.btnInsertAfter;
      document.getElementById('btnLineBreak').innerText = dict.btnLineBreak;
      document.getElementById('btnDelete').innerText = dict.btnDelete;

      document.getElementById('titleAnnotations').innerText = dict.titleAnnotations;
      document.getElementById('btnCustomNote').innerText = dict.btnCustomNote;
      document.getElementById('btnBandIn').innerText = dict.bandIn;
      document.getElementById('btnCorte').innerText = dict.corte;

      // Placeholders y Encabezados
      document.getElementById('songTitleInput').placeholder = dict.titlePlaceholder;
      document.getElementById('artistInput').placeholder = dict.artistPlaceholder;
      document.getElementById('lblTimeSigHeader').innerText = dict.lblTimeSigHeader;
      
      const badgeIntro = document.getElementById('firstSectionBadge');
      if (badgeIntro && badgeIntro.innerText === 'INTRO') {
        badgeIntro.innerText = dict.secIntro;
      }

      updateFooterTitle(document.getElementById('songTitleInput').value);
      updateTotalPagesCounter();
    }

    function changeLanguageManually(lang) {
      localStorage.setItem('preferred_lang', lang);
      applyLanguage(lang);
    }

    function selectMeasure(el) {
      if (selectedMeasure) selectedMeasure.classList.remove('selected');
      selectedMeasure = el;
      selectedMeasure.classList.add('selected');
    }

    // GENERADOR DINÁMICO DE SLASHES SEGÚN MÉTRICA DE TIEMPO
    function getSlashHTML(timeSig) {
      switch (timeSig) {
        case '4/4':
          return '<span>/</span><span>/</span><span>/</span><span>/</span>';
        case '3/4':
          return '<span>/</span><span>/</span><span>/</span>';
        case '2/4':
        case '2/2':
          return '<span>/</span><span>/</span>';
        case '6/8':
          return '<span>/•</span><span>/•</span>';
        case '9/8':
          return '<span>/•</span><span>/•</span><span>/•</span>';
        case '12/8':
          return '<span>/•</span><span>/•</span><span>/•</span><span>/•</span>';
        default:
          return '<span>/</span><span>/</span><span>/</span><span>/</span>';
      }
    }

    function updateTimeSignature(val) {
      document.querySelectorAll('.displayTimeSig').forEach(el => el.innerText = val);
      const html = getSlashHTML(val);
      document.querySelectorAll('.rhythm-slashes').forEach(el => {
        el.innerHTML = html;
      });
    }

    function updateFooterTitle(val) {
      const dict = i18n[currentLang] || i18n['en'];
      const text = val.trim() !== '' ? val.toUpperCase() : dict.untitledChart;
      document.querySelectorAll('.footer-title-ref').forEach(el => el.innerText = text);
    }

    function getCurrentPageContent() {
      const pages = document.querySelectorAll('.chart-paper');
      const lastPage = pages[pages.length - 1];
      return lastPage.querySelector('.chart-content');
    }

    function checkPaginationOverflow() {
      const pages = document.querySelectorAll('.chart-paper');
      const lastPage = pages[pages.length - 1];
      const inner = lastPage.querySelector('.paper-inner');

      if (inner.scrollHeight > 920) {
        createNewPage();
      }
    }

    function createNewPage() {
      pageCount++;
      const dict = i18n[currentLang] || i18n['en'];
      const container = document.getElementById('sheetsContainer');
      const titleText = document.getElementById('songTitleInput').value.toUpperCase() || dict.untitledChart;
      const timeSig = document.getElementById('timeSignatureSelect').value;

      const newPaper = document.createElement('div');
      newPaper.className = 'chart-paper';
      newPaper.id = `paper-page-${pageCount}`;

      newPaper.innerHTML = `
        <div class="paper-inner">
          <div class="chart-header">
            <div style="font-family:'Bungee', cursive; font-size:1.4em; text-align:center; text-transform:uppercase;">${titleText} (CONT.)</div>
            <div class="header-sub-row">
              <div>${dict.lblTimeSigHeader}: <span class="displayTimeSig">${timeSig}</span></div>
              <div>${dict.continuation} ${pageCount}</div>
            </div>
          </div>
          <div class="chart-content"></div>
        </div>
        <div class="chart-footer">
          <div class="footer-title-ref">${titleText}</div>
          <div class="page-num-ref">${dict.pageLabel} ${pageCount} / ${pageCount}</div>
        </div>
      `;

      container.appendChild(newPaper);
      updateTotalPagesCounter();
    }

    function updateTotalPagesCounter() {
      const dict = i18n[currentLang] || i18n['en'];
      const total = document.querySelectorAll('.chart-paper').length;
      document.querySelectorAll('.page-num-ref').forEach((el, idx) => {
        el.innerText = `${dict.pageLabel} ${idx + 1} / ${total}`;
      });
    }

    function addEditableSection() {
      const dict = i18n[currentLang] || i18n['en'];
      addSection(dict.secNew, true);
    }

    function createMeasureElement() {
      const dict = i18n[currentLang] || i18n['en'];
      const timeSig = document.getElementById('timeSignatureSelect').value;
      const box = document.createElement('div');
      box.className = 'measure-box';
      box.style.flex = '0 0 25%';
      box.onclick = function() { selectMeasure(this); };
      box.innerHTML = `
        <input type="text" class="chord-input" placeholder="${dict.chordPlaceholder}">
        <div class="rhythm-slashes">${getSlashHTML(timeSig)}</div>
      `;
      return box;
    }

    function addSection(title, isEditable = false) {
      const content = getCurrentPageContent();
      const newBlock = document.createElement('div');
      newBlock.className = 'section-block';

      const grid = document.createElement('div');
      grid.className = 'measures-grid';
      for (let i = 0; i < 4; i++) {
        grid.appendChild(createMeasureElement());
      }

      newBlock.innerHTML = `<span class="section-badge" contenteditable="true">${title}</span>`;
      newBlock.appendChild(grid);
      content.appendChild(newBlock);
      checkPaginationOverflow();
    }

    function addMultipleMeasures(qty) {
      const count = qty || parseInt(document.getElementById('customMeasureQty').value) || 1;
      
      let targetGrid;
      if (selectedMeasure && selectedMeasure.parentNode) {
        targetGrid = selectedMeasure.parentNode;
      } else {
        const grids = document.querySelectorAll('.measures-grid');
        targetGrid = grids[grids.length - 1];
      }

      if (!targetGrid) {
        const dict = i18n[currentLang] || i18n['en'];
        addSection(dict.secNew);
        targetGrid = document.querySelectorAll('.measures-grid')[0];
      }

      for (let i = 0; i < count; i++) {
        const box = createMeasureElement();
        if (selectedMeasure && selectedMeasure.parentNode === targetGrid) {
          targetGrid.insertBefore(box, selectedMeasure.nextSibling);
          selectedMeasure = box;
        } else {
          targetGrid.appendChild(box);
        }
      }

      checkPaginationOverflow();
    }

    function insertMeasure(position) {
      const dict = i18n[currentLang] || i18n['en'];
      if (!selectedMeasure) {
        alert(dict.alertSelectMeasure);
        return;
      }

      const newBox = createMeasureElement();
      if (position === 'before') {
        selectedMeasure.parentNode.insertBefore(newBox, selectedMeasure);
      } else {
        selectedMeasure.parentNode.insertBefore(newBox, selectedMeasure.nextSibling);
      }

      selectMeasure(newBox);
      checkPaginationOverflow();
    }

    function toggleSystemBreak() {
      const dict = i18n[currentLang] || i18n['en'];
      if (!selectedMeasure) {
        alert(dict.alertSelectBreak);
        return;
      }
      const grid = selectedMeasure.parentNode;
      const breakEl = document.createElement('div');
      breakEl.className = 'measure-box break-system';
      grid.insertBefore(breakEl, selectedMeasure.nextSibling);
      checkPaginationOverflow();
    }

    function removeSelectedMeasure() {
      if (selectedMeasure && selectedMeasure.parentNode) {
        selectedMeasure.parentNode.removeChild(selectedMeasure);
        selectedMeasure = null;
      }
    }

    function addAnnotation(text, isEditable = false) {
      const dict = i18n[currentLang] || i18n['en'];
      if (!selectedMeasure) {
        alert(dict.alertSelectNote);
        return;
      }
      let badge = selectedMeasure.querySelector('.band-annotation');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'band-annotation';
        badge.contentEditable = 'true';
        selectedMeasure.appendChild(badge);
      }
      badge.innerText = text;
    }

    const notesChromatic = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const notesFlats = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

    function transposeChord(chord, semitones) {
      return chord.replace(/[A-G][#b]?/g, (match) => {
        let index = notesChromatic.indexOf(match);
        if (index === -1) index = notesFlats.indexOf(match);
        if (index === -1) return match;
        let newIndex = (index + semitones + 12) % 12;
        return notesChromatic[newIndex];
      });
    }

    function transposeAll(semitones) {
      document.querySelectorAll('.chord-input').forEach(input => {
        if (input.value.trim() !== '') {
          input.value = transposeChord(input.value, semitones);
        }
      });
    }

    function exportAllPagesToPNG() {
      const papers = document.querySelectorAll('.chart-paper');
      papers.forEach((paper, idx) => {
        html2canvas(paper, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          link.download = `chart-pagina-${idx + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      });
    }

    // Inicializar idioma al cargar el documento
    window.addEventListener('DOMContentLoaded', () => {
      initLanguage();
    });
  </script>
</body>
</html>
