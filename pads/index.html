<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura · Ambient Pad Player</title>
  <style>
    :root {
      --bg-color: #0b0d17;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --text-main: #ffffff;
      --text-muted: #8a99ad;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .header-container {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 3px;
      margin: 0 0 5px 0;
      font-size: 2em;
      background: linear-gradient(135deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.9em;
      letter-spacing: 1px;
    }

    /* SELECTOR DE PRESETS */
    .preset-container {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px;
      border-radius: 30px;
      border: 1px solid var(--card-border);
      flex-wrap: wrap;
      justify-content: center;
    }

    .preset-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .preset-btn:hover {
      color: var(--text-main);
    }

    .preset-btn.active {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      color: #fff;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
    }

    /* GRILLA DE NOTAS */
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 680px;
      width: 100%;
    }

    .pad-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px 10px;
      color: var(--text-main);
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .pad-btn:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
      transform: translateY(-2px);
    }

    .pad-btn.active {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.8), rgba(6, 182, 212, 0.8));
      border-color: #a78bfa;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
    }

    @media (max-width: 500px) {
      .pad-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>AURA · AMBIENT PADS</h1>
    <p class="subtitle">Select a sound preset and key to engage continuous pad</p>
  </div>

  <!-- SELECTOR DE 4 SONIDOS -->
  <div class="preset-container">
    <button class="preset-btn active" onclick="selectPreset('pad1', this)">DAWN</button>
    <button class="preset-btn" onclick="selectPreset('pad2', this)">CELESTIAL</button>
    <button class="preset-btn" onclick="selectPreset('pad3', this)">MAJESTIC</button>
    <button class="preset-btn" onclick="selectPreset('pad4', this)">ELYSIUM</button>
  </div>

  <!-- GRILLA DE 12 TONALIDADES -->
  <div class="pad-grid">
    <button class="pad-btn" onclick="togglePad('C', this)">C</button>
    <button class="pad-btn" onclick="togglePad('Cs', this)">C# / Db</button>
    <button class="pad-btn" onclick="togglePad('D', this)">D</button>
    <button class="pad-btn" onclick="togglePad('Ds', this)">D# / Eb</button>
    <button class="pad-btn" onclick="togglePad('E', this)">E</button>
    <button class="pad-btn" onclick="togglePad('F', this)">F</button>
    <button class="pad-btn" onclick="togglePad('Fs', this)">F# / Gb</button>
    <button class="pad-btn" onclick="togglePad('G', this)">G</button>
    <button class="pad-btn" onclick="togglePad('Gs', this)">G# / Ab</button>
    <button class="pad-btn" onclick="togglePad('A', this)">A</button>
    <button class="pad-btn" onclick="togglePad('As', this)">A# / Bb</button>
    <button class="pad-btn" onclick="togglePad('B', this)">B</button>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    const activePads = {};
    let currentPreset = 'pad1';

    function selectPreset(presetKey, btnElement) {
      currentPreset = presetKey;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
    }

    async function togglePad(note, btnElement) {
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      // Ruta relativa limpia utilizando guion bajo (_)
      const audioUrl = `./audio/${currentPreset}_${note}.mp3`;
      const padKey = `${currentPreset}_${note}`;

      if (activePads[padKey]) {
        // FADE OUT
        const { gainNode, sourceNode } = activePads[padKey];
        const now = audioCtx.currentTime;
        const fadeOutTime = 2.5; 

        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + fadeOutTime);

        btnElement.classList.remove('active');

        setTimeout(() => {
          sourceNode.stop();
          sourceNode.disconnect();
          delete activePads[padKey];
        }, fadeOutTime * 1000);

      } else {
        // FADE IN
        try {
          btnElement.classList.add('active');
          const response = await fetch(audioUrl);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const buffer = await response.arrayBuffer();
          const audioBuffer = await audioCtx.decodeAudioData(buffer);

          const sourceNode = audioCtx.createBufferSource();
          const gainNode = audioCtx.createGain();

          sourceNode.buffer = audioBuffer;
          sourceNode.loop = true;

          const now = audioCtx.currentTime;
          const fadeInTime = 2.0; 

          gainNode.gain.setValueAtTime(0.0001, now);
          gainNode.gain.exponentialRampToValueAtTime(1.0, now + fadeInTime);

          sourceNode.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          sourceNode.start(0);
          activePads[padKey] = { sourceNode, gainNode, btnElement };

        } catch (e) {
          console.error("Audio file not found: " + audioUrl, e);
          btnElement.classList.remove('active');
        }
      }
    }
  </script>
</body>
</html>
